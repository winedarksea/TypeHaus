# tasks.toml — work-package status and the visits inside it.
# Written by Type:Haus and safe to edit by hand. See docs/site-state-format.md.
#
# [visits] is the schedulable unit: one sub, one arrival. The split below started as
# `haus schedule houses/catlin --propose task/concrete/building` and was then EDITED, which
# is the whole arrangement — the engine proposes from the BOM row families and the tag
# families, and it cannot know that this house's concrete is two subs and that the sleeves
# have to be in the ground before the second one arrives. Dates and assignees are
# deliberately absent until somebody is actually booked.

# One sub, one mobilisation, three stops — which is exactly what checkpoints are for. The
# footing inspection sits BETWEEN the first and the second, and before checkpoints existed
# the only way to say so was to invent two visits for one arrival.
# ** THE ROW IS `pad:PIER_BASE_12`, NOT `footing`, SINCE 2026-09-14. ** The eight isolated
# pours this visit places — the north entry's six piers and the two centre-garden ones —
# became `Pad`s that day, which is what took their `spread_footing/` items out of the
# engineering register (a flat pad is the shape IRC Table R507.3.1 publishes; a 36" bell is
# not). Same eight pours, same arrival, same 1.06 cy; the BOM key moved under them and this
# row followed it. The house's own strip footings are `task/concrete/basement/*` and never
# were in this package, which is why nothing here replaces the old key.
[visits."task/concrete/building/footings"]
label = "Isolated pier pads and the thermal break — house, court, breezeway"
rows = ["concrete:pad:PIER_BASE_12", "concrete:thermal_break", "allowances:concrete-pumping"]
element_tags = ["FT-*", "PD-*"]
depends_on = ["task/earth/basement", "task/earth/building", "insp/erosion"]
checkpoints = [
  { id = "forms", label = "Forms, steel and the thermal-break board set" },
  { id = "pour", label = "Pour", after = ["insp/footing"] },
  { id = "strip", label = "Strip and cure", cure_days = 3 },
]
constraints = [
  { label = "rebar fabricated, delivered and inspected — galvanized, A1094 stock or A767 after fabrication, route named on the order (includes the column cages, 12 off)" },
  { label = "thermal-break board on site — it is cast WITH the footing, not after" },
  { label = "pump or chute access confirmed for the whole pour" },
  { label = "approved plan set on site and current" },
  { label = "confirmed with the sub 48 hours ahead" },
]

[visits."task/concrete/basement/walls"]
label = "Foundation walls — basement, garage ICF, sunken garden, curbs"
depends_on = ["task/concrete/building/footings", "insp/footing"]
constraints = [
  { label = "sleeves and block-outs marked on the forms before any steel goes in" },
  { label = "P/E/M on site during forming — every sleeve is a pre-pour operation" },
  { label = "anchor bolt layout marked against the sill plan" },
  { label = "cold-weather protection on site if the forecast says so" },
  { label = "confirmed with the sub 48 hours ahead" },
]

# ** THE MEMBRANE IS A VISIT NOW (2026-09-12), AND IT STANDS BEFORE BACKFILL. **
# Until today the below-grade waterproofing was filed on the SIDING trade — `takeoff/
# envelope.py` scopes a foundation wall's layers as "foundation wall", which was not in
# `emit/trade_rules._POUR_SCOPES` — so it collapsed into `task/walls/building`, which
# depends on framing and the roof. The wall it goes on is buried weeks before either.
# Its own arrival: one crew, one day on the wall, and the backfill follows it in the same
# mobilisation. `insp/foundation_backfill` ("Waterproofing, drainage and backfill") is what
# releases the earth and framing trades, and its on-site list is this visit's own checklist.
[visits."task/concrete/building/waterproofing"]
label = "Waterproofing, free-draining stone and backfill"
rows = ["envelope_layers:waterproofing", "allowances:foundation-free-draining-backfill"]
depends_on = ["task/concrete/basement/walls"]
checkpoints = [
  { id = "membrane", label = "Cold joint treated, primer flashed off, sheet rolled and corners reinforced" },
  { id = "foam", label = "XPS bonded to the cured membrane with foam-compatible mastic" },
  { id = "stone", label = "Free-draining stone and geotextile against the lower wall", after = ["insp/foundation_backfill"] },
]
constraints = [
  { label = "forms stripped and the wall face clean and dry — the sheet is adhered, not hung" },
  { label = "membrane grade matched to the forecast: Low Temperature + Primer B2 LVC below 40 F" },
  { label = "backfill booked inside 30 days of the sheet going on — it is not UV-stable" },
  { label = "backfill placed in controlled lifts: there is no protection course over the foam" },
  { label = "confirmed with the sub 48 hours ahead" },
]

[visits."task/concrete/building/slabs"]
label = "Slabs on grade — basement, garage, heat-pump pad, interior decks"
rows = ["concrete:slab", "concrete:slab:DECK_EPS_INT", "concrete:slab:HP_PAD_ON_GRADE",
        "concrete:column:PIER_CONCRETE_12", "concrete:column:SUNKEN_GARDEN_COLUMN_12",
        "hardware:AB-058-10-SS", "allowances:radon-passive-pipe-and-stack",
        "allowances:concrete-cold-weather-protection"]
element_tags = ["SL-*", "PT-SG-*", "PT-BW-*"]
# Not the trade order: the sleeves, the radon collection point and the in-floor tube are all
# plumbing work, and every one of them is under the slab. This is the dependency a
# (trade x storey) package could not express.
depends_on = ["task/concrete/basement/walls", "insp/underground_plumbing",
              "insp/radon_rough"]
constraints = [
  { label = "under-slab insulation and vapour retarder placed, lapped and unpunctured" },
  { label = "in-floor tube pressurised and gauged, and it stays under pressure through the pour" },
  { label = "radon collection point and riser set, sump cover gasketed" },
  { label = "confirmed with the sub 48 hours ahead" },
]

[visits."task/concrete/building/flatwork"]
label = "Flatwork — driveway apron and walks"
# ** THE WATERPROOFING IS NOT HERE ANY MORE (2026-09-12). ** This visit carried
# `allowances:foundation-damp-or-waterproofing`, and this visit `depends_on
# insp/foundation_backfill` — so the membrane that has to be on the wall BEFORE the backfill
# inspection was scheduled after it. The allowance is deleted and the membrane is a modelled
# layer on the concrete trade now, which puts it in the wall package where it belongs.
rows = ["allowances:concrete-driveway-apron-and-walks"]
element_tags = ["DW-*"]
# Last, and deliberately after backfill: a new apron under a loaded truck is a repair.
# And `blocks_successors = false` because of the other half of that sentence: framing's
# package-level predecessor is the concrete package, and expanded to every concrete arrival
# it made the framers wait on the driveway apron — which is poured after they leave.
depends_on = ["task/concrete/building/slabs", "insp/foundation_backfill"]
blocks_successors = false
constraints = [
  { label = "final grade set — the apron is poured to it, not corrected afterwards" },
  { label = "confirmed with the sub 48 hours ahead" },
]

# The mason is a different sub on a different trip, and both wythes are built against
# cured concrete: the veneer stands on W-SG-BRKBM and the firebox on the main deck.
#
# ** ONE BLEND HOUSE-WIDE SINCE 2026-09-13, AND THAT CHANGED WHAT THIS VISIT'S FIRST CONSTRAINT
# MEANS. ** It used to read "one blend, enough for the whole 129 SF field" — a constraint written
# for the court alone, which never ordered the second (white) pallet the firebox needed, so the
# two halves of this visit disagreed about how many colours were arriving. The firebox is now the
# court's own brown brick and is WASHED WHITE afterwards by the painter, so "one blend" is no
# longer a preference about the field: it is the only blend on the job, and this visit orders all
# of it — 112.5 SF of court field plus 20.4 SF of firebox, 132.9 SF off two cubes.
#
# ** THE FIREBOX IS LAID BARE. ** The wash is a separate trade on a separate arrival
# (task/paint/building/mineral-wash), so the mason must not substitute a white brick to "get the
# look" — the panel will read white from the coating. That is a constraint below, not a note.
#
# The row key moved with the blend: `wall_structure:FIREPLACE_BRICK_WYTHE:white-brick` ->
# `:brown-brick`. `schedule/rules.py::orphan_rows` is an ERROR, so `haus site validate` exits 1
# until it is renamed — which is the one machine-caught consequence of this whole change.
#
# The wash's own BOM row is deliberately NOT listed here: `schedule/rules.py::shared_rows` errors
# when two visits claim one row, and the coating visit owns it and `depends_on` this one.
[visits."task/masonry/building/masonry"]
label = "Brick — the court veneer and the living-room firebox"
rows = ["wall_structure:BASEMENT_BRICK_VENEER:brown-brick",
        "wall_structure:FIREPLACE_BRICK_WYTHE:brown-brick"]
element_tags = ["W-B-BRICK", "W-M-FIRE-*"]
depends_on = ["task/concrete/basement/walls", "task/concrete/building/slabs"]
blocks_successors = false
constraints = [
  { label = "brick and mortar delivered — ONE blend for the whole job, 132.9 SF (112.5 court + 20.4 firebox), no second colour on the order", owner = "owner" },
  { label = "the firebox panel is laid BARE in the court blend and washed white later — do NOT substitute a white brick", owner = "owner", next_action = "the white reads from the mineral silicate wash, applied by the painter on a later arrival; a white body would order a third cube against ~21 SF of need" },
  { label = "weeps, soft joints at both ends and the anchor schedule agreed", owner = "owner", next_action = "unreinforced brick cannot span 18'-8\" horizontally — do not anchor the wythe to W-SG-W1/E1" },
  { label = "scaffold access for the full 8'-5\" field priced in", severity = "attention" },
  { label = "firebox head is a CUT COURSE on a steel angle lintel, not a rowlock", owner = "owner" },
]

# --- PAINT: three arrivals, and they are genuinely three ------------------------------------
# This package was one implicit visit until 2026-09-13, when the court's mineral silicate wash
# arrived and made the fiction visible: an interior painter after drywall, an exterior coating
# crew on backfilled foundation walls, and the court wash are not one arrival by any reading.
# Authored as a full split so no BOM row falls to no visit (`schedule/rules.py::unassigned_scope`
# is a warning, and a warning nobody reads is how scope goes missing).
[visits."task/paint/building/interior"]
label = "Interior paint — walls, ceilings, trim and doors"
rows = ["envelope_layers:latex-paint", "envelope_layers:latex-paint-accent",
        "allowances:paint-trim-and-doors"]
depends_on = ["task/drywall/building"]
constraints = [
  { label = "drywall finished to the agreed level" },
  { label = "colours confirmed per room", owner = "owner" },
]

[visits."task/paint/building/foundation-coating"]
label = "Foundation coating — the above-grade XPS band, all four sides"
rows = ["envelope_layers:foundation-coating-acrylic"]
element_tags = ["W-B-N*", "W-B-E*", "W-B-W*", "W-B-S*"]
depends_on = ["task/insulation/building/foam-and-girts", "insp/foundation_backfill"]
constraints = [
  { label = "the band runs from 6\" BELOW grade to the wall top — no foam edge left at the soil line" },
  { label = "mesh over the WHOLE face, then skim, wait two hours, texture — it is not a one-pass parge" },
]

# ** THE COURT WASH. A SEPARATE TRADE AND A SEPARATE ARRIVAL FROM THE MASON, AND IT IS BOOKED
# LATE ON PURPOSE. ** The exterior work wants the court backfilled and the forms long gone;
# the fireplace wants the room framed and the heat on. Beeck ask for >=12 h between coats, forbid
# application in blazing sun or below 40 F, and want an absorbent substrate left DAMP — none of
# which composes with a cold, wet, still-being-poured court.
#
# ** ALL FOUR SURFACES ARE IN ONE VISIT BECAUSE OF A JOB-SIZE MINIMUM, NOT FOR TIDINESS. ** The
# binding Twin Cities number is a $2,000 EXTERIOR JOB-SIZE minimum. The six columns alone are
# ~181 SF and price at $750-1,900, which is under it at any rate in the range — let separately
# they would cost $2,000 regardless. Combined with 953 SF of wall face the scope is ~$3,500-6,700
# and the minimum is absorbed. Do not split this visit to "sequence the columns".
#
# `depends_on` the masonry visit: the fireplace panel is laid BARE in the court blend and reads
# white from this coat. The wash's BOM rows are owned HERE and are deliberately not also listed on
# the masonry visit — `schedule/rules.py::shared_rows` errors when two visits claim one row.
[visits."task/paint/building/mineral-wash"]
label = "Mineral silicate wash — the court, the columns, the garden blocks and the firebox"
rows = ["envelope_layers:silicate-wash-white", "envelope_layers:silicate-wash-white-block",
        "allowances:paint-court-mineral-wash-columns"]
element_tags = ["W-SG-*", "PT-SG-*", "W-RG-BLOCK", "W-RG-WEST", "W-RG-EAST", "W-M-FIRE-*"]
depends_on = ["task/masonry/building/masonry", "insp/foundation_backfill"]
blocks_successors = false
constraints = [
  { label = "TEST PANEL on a spare SRW block accepted before the 232 SF of garden legs is started", owner = "owner", next_action = "dry-cast block is frequently dosed with an integral water repellent, which a potassium silicate cannot bond to — confirm with the block manufacturer in writing and switch to Beecko-SOL if so; this is the manufacturers' own instruction, not a precaution added here" },
  { label = "substrate UNTREATED — no silane, siloxane or sealer on anything to be washed, ever", owner = "owner", next_action = "the repellent and the wash are alternatives; SUNKEN_GARDEN_COLUMN_12 no longer specifies one and no recoat obligation survives" },
  { label = "etch + formwork-oil removal + pore-deep pressure rinse priced as its own line", severity = "attention", next_action = "mandatory per the Beeckosil TDS on new cast concrete and inside NO painting $/SF that could be sourced — it is not in the [envelope_layers] rates" },
  { label = "court backfilled, forms gone, and >=40 F with no blazing sun for the run of the work" },
  { label = "firebox: the Amantii BI-30-XTRASLIM is TRIMLESS, so wash before the appliance is set or mask it, and stop at the reveal returns", owner = "owner" },
  { label = "walnut mantel goes on AFTER the wash cures — its hold-down blocking is still pre-brick" },
  { label = "W-B-BRICK stays BARE brown — it is the deliberate accent wall and is NOT in this scope", owner = "owner" },
  { label = "wall TOPS and SL-SG-FLOOR stay uncoated — a walked mineral coating wears and is a slip question" },
]

# The insulation trade's first arrival, and the one with the hold that cannot be checked
# afterwards. There is no WRB on this house: the continuous exterior foam IS the weather
# plane, the girts are screwed through it, and once the foam is on nobody can see a missed
# screw again. The same hold appears as an `[[extra]]` inspection with `authority = "owner"`
# in inspections.toml, which is what makes it gate the whole insulation trade rather than
# only this one visit. Siding follows it by the `depends_on` below, not by the trade order:
# exterior foam before cladding is this house's sequence, not every house's.
[visits."task/insulation/building/foam-and-girts"]
label = "Continuous exterior foam, girts and the weather plane"
depends_on = ["task/framing/building", "insp/framing", "insp/girt_screws"]
constraints = [
  { label = "girt screws verified on every wall — one 8\" screw per three-ply block, counted wall by wall" },
  { label = "girt course phase checked against the window heads" },
  { label = "sprayer, rig and installer booked — this foam is SPRAYED (4\" ccSPF), not boards and tape" },
  { label = "foam product is on the notes/ccspf_spec.md qualifying list — no 2\"/pass product substituted" },
  { label = "spray day forecast 60-80 F and dry; sheathing under 16% MC on a pin meter" },
  { label = "all wall penetrations set — nothing goes through the plane afterwards" },
  { label = "confirmed with the sub 48 hours ahead" },
]

# ** AUTHORED ONLY TO NAME ITS BLOCKERS, AND THE SLUG HAD TO CHANGE TO DO IT. **
# A visit slug is a PACKAGE slug plus a label, so there is no way to author the implicit
# `task/framing/building` visit in place — `task/framing/building/frame` is a new visit id.
# The work PACKAGE keeps its own slug and GlobalId, which is what `haus tasks --csv` exports
# and what a PM tool keyed on, so the re-export updates rather than duplicates there.
#
# Why author it at all: `site/long-lead-orders` carries the floor-truss row and, until the
# `insp/truss_mep_review` edge above, nothing downstream referenced it. The truss order now
# waits on the MEP review; this is the edge that makes the framing wait on the order, so the
# hold gates something that gates something.
#
# An authored visit inherits NO trade gate, so `insp/foundation_backfill` has to be restated
# here. That is the cost of authoring, paid deliberately — dropping it would silently let
# framing start over an un-inspected backfill.
#
# **Package slugs, not the four concrete arrival slugs.** A later re-split of the concrete
# packages must not leave this list stale, and a package slug survives one where an arrival
# slug does not.
#
# `site/long-lead-orders` is named LAST so the date line keeps naming
# `task/concrete/basement/walls`: `visit_dates` skips inspection dependencies and reads the
# order of this list back.
[visits."task/framing/building/frame"]
label = "Frame the building — walls, decks, roof"
depends_on = [
  "task/concrete/building",
  "task/concrete/basement",
  "insp/foundation_backfill",
  "site/long-lead-orders",
]

# ---------------------------------------------------------------------------------------
# The calendar and the subs.
#
# `[calendar]` is authored because "legal holidays" is a jurisdiction's answer and a crew's
# is narrower still. Minn. Stat. 216D.04 counts a locate's 48 hours in working days, and
# every suggested date in `haus schedule` walks this list.
# ---------------------------------------------------------------------------------------

[calendar]
workdays = [0, 1, 2, 3, 4]
holidays = ["2027-01-01", "2027-05-31", "2027-07-05", "2027-09-06", "2027-11-25",
            "2027-11-26", "2027-12-24", "2027-12-27"]

# `[contractors]` is empty until somebody is actually hired. A visit with no `contractor`
# shows the gap; it never blocks. `licence` is asked for only on electrical and plumbing,
# which are the two trades Minnesota licenses — asking for one on a framer would be the
# tool inventing a requirement.

# ---------------------------------------------------------------------------------------
# Preconstruction: the arrivals that draw from no work package at all.
#
# These are `site/<label>` standalone visits. Before them the board was blind to every
# permit, every locate and every long-lead order — the whole of what an owner-builder does
# in the six months before a shovel moves. None of them has a `duration_days` yet, so each
# reads "needs confirmation" rather than carrying a date nobody agreed to.
# ---------------------------------------------------------------------------------------

[visits."site/survey-stakes"]
label = "Boundary and topographic survey, corners and benchmark staked"
trade = "earth"
milestone = "preconstruction"
constraints = [
  { label = "licensed surveyor engaged", owner = "owner", next_action = "call three; the as-built at the end is the same survey and the same trip" },
  { label = "benchmark set where it survives the excavation", owner = "surveyor" },
  { label = "setbacks staked against the SetbackSpec on S-001", owner = "surveyor" },
]

[visits."site/building-permit"]
label = "Building permit — Saint Paul DSI"
trade = "general"
milestone = "preconstruction"
depends_on = ["site/survey-stakes"]
constraints = [
  { label = "approved plan set issued and on site", owner = "owner", next_action = "haus print houses/catlin --sealed once the seals are pinned" },
  { label = "lead time, appointment window and reinspection fee asked for at issuance", owner = "owner", next_action = "Minn. R. 1300.0210 subp. 4 obliges DSI to state them; write them into [authorities]", follow_up = "at issuance" },
  { label = "code edition on the permit written into [permit].code_edition", owner = "owner", next_action = "2020 MN code is likely; the 2024-IRC cycle has no adopted date" },
  { label = "inspection record card received, to be posted on site", owner = "owner" },
]

[visits."site/construction-management-acknowledgement"]
label = "Construction Management Acknowledgement — before any work starts"
trade = "general"
milestone = "preconstruction"
constraints = [
  { label = "CMA signed and filed", owner = "owner", next_action = "Saint Paul requires it before work starts, separately from the building permit" },
]

[visits."site/sewer-permit"]
label = "Sanitary sewer connection permit — Public Works"
trade = "plumbing"
milestone = "preconstruction"
constraints = [
  { label = "sewer availability and invert confirmed at the main", owner = "owner", next_action = "Public Works 651-266-6234", follow_up = "before the excavation is booked" },
  { label = "SAC determination and fee", owner = "owner", next_action = "an attention cost item — record the amount in costs.toml", severity = "attention" },
]

[visits."site/water-permit"]
label = "Water service permit and tap — Saint Paul Regional Water Services"
trade = "plumbing"
milestone = "preconstruction"
constraints = [
  { label = "service size and tap location agreed", owner = "owner", next_action = "SPRWS 651-266-6350" },
  { label = "curb stop location staked before the excavation", owner = "owner" },
]

[visits."site/row-permit"]
label = "Right-of-way permit — driveway apron and public walk"
trade = "concrete"
milestone = "preconstruction"
constraints = [
  { label = "ROW permit issued", owner = "owner", next_action = "Public Works ROW 651-266-6120" },
  { label = "boulevard tree protection or removal cleared with Forestry", owner = "owner", next_action = "Forestry 651-266-6400" },
]

[visits."site/radon-permit"]
label = "Radon plumbing permit — the passive system is its own permit"
trade = "plumbing"
milestone = "preconstruction"
constraints = [
  { label = "radon plumbing permit pulled", owner = "owner", next_action = "Saint Paul issues this separately from the building permit; the system itself is mandatory under Minn. R. 1303.2400-.2403" },
]

[visits."site/zoning-and-fees"]
label = "Zoning design review, SAC and parkland fees"
trade = "general"
milestone = "preconstruction"
constraints = [
  { label = "zoning design review cleared", owner = "owner", severity = "attention" },
  { label = "parkland dedication fee determined", owner = "owner", severity = "attention", next_action = "record the amount in costs.toml — dollars do not live here" },
]

[visits."site/gopher-state-one-call"]
label = "Gopher State One Call locate ticket"
trade = "earth"
milestone = "preconstruction"
depends_on = ["site/survey-stakes"]
# A typed hold: the two dates below are DERIVED from `start` by Minn. Stat. 216D.04 —
# 48 working hours to arm, 14 calendar days to expire — and nothing else here is.
# With no `start` authored the board says "needs confirmation" rather than guessing one.
constraints = [
  { label = "locate ticket called in", kind = "locate", owner = "owner", next_action = "gopherstateonecall.org or 811; the ticket expires 14 calendar days after notice" },
  { label = "private utilities located separately — 811 marks the utility's side only", owner = "owner" },
  { label = "white-lining done before the call", owner = "owner" },
]

[visits."site/temp-power-and-water"]
label = "Temporary power and water"
trade = "electrical"
milestone = "preconstruction"
constraints = [
  { label = "temporary service pole set and energised", owner = "owner", next_action = "Xcel, and the electrical permit covers the temp service" },
  { label = "water source for the concrete crew agreed", owner = "owner" },
]

[visits."site/access-and-erosion-control"]
label = "Site access, rock entrance, silt fence and the dumpster"
trade = "earth"
milestone = "preconstruction"
depends_on = ["site/gopher-state-one-call"]
constraints = [
  { label = "rock construction entrance in", owner = "owner" },
  { label = "silt fence along the downhill edge", owner = "owner", next_action = "it is the erosion inspection's first on-site item" },
  { label = "spoil and topsoil stockpile located clear of the excavation", owner = "owner" },
]

# ** THE TRUSS ORDER WAITS ON THE MEP REVIEW, AND THIS EDGE IS THE ONLY THING THAT SAYS SO. **
# BLD-05's real recommendation is a meeting held at the right time, and until now it was a
# sentence in a document: this visit carried the floor-truss row, had no `depends_on`, and
# nothing downstream referenced it. `insp/truss_mep_review` is an owner hold in
# inspections.toml; see the comment on it for why it is an `[[extra]]` with no `gates`.
[visits."site/long-lead-orders"]
label = "Long-lead orders — trusses, windows, ERV, steel, cabinets"
trade = "framing"
milestone = "preconstruction"
depends_on = ["insp/truss_mep_review"]
# Every `lead_days` below is deliberately BLANK until it is quoted. The board says "lead
# time unknown" and asks for it thirty days before the suggested start; it never defaults
# one, because a fabricated lead time is the number a schedule gets built on.
materials = [
  { id = "roof-trusses", label = "Roof trusses — quote against the DRIFT case, not the ground snow", source = "fabricator TBD" },
  { id = "floor-trusses", label = "FS-S-WEST open-web floor trusses, 18' trimmable blanks", source = "fabricator TBD" },
  { id = "windows", label = "Windows and glazed doors, against the RO schedule on A-601" },
  { id = "erv", label = "Broan B210E75RT and its manifolds" },
  { id = "heat-pumps", label = "Gree FLEXX Ultra 24 air handler and outdoor units" },
  { id = "lvl-and-glulam", label = "RB-HOUSE 2-1.75x16 LVL in three 12' pieces; the three treated SYP glulams" },
  { id = "galvanized-rebar", label = "Column cages, 12 off, galvanized — A1094 stock or A767 after fabrication, route named on the order" },
  { id = "cabinets", label = "Kitchen and bath casework" },
  { id = "metal-panel", label = "Board-and-batten and PBR wall panel, Metal Sales — the only verified open-girt report" },
]
constraints = [
  { label = "every lead time above quoted and written in", owner = "owner", next_action = "a blank lead_days is the board asking, not the board defaulting", severity = "attention" },
]

# ---------------------------------------------------------------------------------------
# Complete: the arrivals after the last trade package.
# ---------------------------------------------------------------------------------------

[visits."site/final-survey"]
label = "As-built survey filed with DSI"
trade = "earth"
milestone = "complete"
blocks_successors = false
constraints = [
  { label = "as-built survey filed", owner = "owner", next_action = "the same surveyor as the corners — it is an on-site item of the building final" },
]

[visits."site/energy-certificate"]
label = "Energy certificate posted on the electrical panel"
trade = "electrical"
milestone = "complete"
blocks_successors = false
constraints = [
  { label = "certificate completed and posted", owner = "owner", next_action = "Minn. R. 1322.0401 — it names the general contractor, which on this build is the owner" },
]

[visits."site/punch-list"]
label = "Punch list and close-out"
trade = "furniture"
milestone = "complete"
blocks_successors = false
constraints = [
  { label = "certificate of occupancy in hand", owner = "owner" },
  { label = "every lien waiver received against every payment made", owner = "owner", severity = "attention" },
  { label = "warranties, manuals and the as-built set filed", owner = "owner", severity = "attention" },
]
