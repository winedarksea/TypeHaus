"sunken_garden.raised_soil_height_in" = 30
"sunken_garden.planting_width_in" = 36
"sunken_garden.cladding" = "fiber-cement"

[[variant]]
name = "setback-24-brick"
description = "Separate 30-inch by 24-inch bed beyond a 36-inch clear strip; brick."
[variant.parameters]
"sunken_garden.planting_layout" = "setback"
"sunken_garden.raised_soil_height_in" = 30
"sunken_garden.planting_width_in" = 24
"sunken_garden.planter_setback_in" = 36
"sunken_garden.cladding" = "brick"

[[variant]]
name = "setback-24-fiber-cement"
description = "Separate 30-inch by 24-inch bed beyond a 36-inch clear strip; panel screen."
assembly_swaps = { BASEMENT_BRICK_VENEER = "BASEMENT_FIBER_CEMENT_SCREEN" }
[variant.parameters]
"sunken_garden.planting_layout" = "setback"
"sunken_garden.raised_soil_height_in" = 30
"sunken_garden.planting_width_in" = 24
"sunken_garden.planter_setback_in" = 36
"sunken_garden.cladding" = "fiber-cement"

[[variant]]
name = "setback-36-brick"
description = "Separate 30-inch by 36-inch bed beyond a 36-inch clear strip; brick."
[variant.parameters]
"sunken_garden.planting_layout" = "setback"
