# The existing geometry remains the base plan. These variants are isolated imports of that
# plan with parameter values applied before geometry is generated.

# What the retaining-court study prices (`haus retaining-court-study`): tag substrings for
# the court, the raised terrace and the comparison planter, and the whole-site allowances
# reported beside the deltas. Every swapped assembly is in scope as well.
[study]
scope_tags = ["-SG-", "-RG-", "-RGV-"]
allowance_words = ["sunken-garden", "court"]

[[variant]]
name = "reference"
description = "Existing 40-inch raised garden, LP SmartSide panel court face, 12-inch stems and 7-foot footings."

# The court face as brick (W-B-BRICK on W-SG-BRKBM): one parameter and two assembly swaps
# (notes/court_face_lp_panel.md, "Switching back to brick").
[[variant]]
name = "court-face-brick"
description = "The court's house face as the anchored brown brick wythe on its grade beam."
assembly_swaps = { EXT_2X6_LP_PANEL = "GARDEN_FRAMED_2X6", SAUNA_LINER_ON_EXT_2X6_LP = "SAUNA_LINER_ON_GARDEN_FRAMED" }
[variant.parameters]
"sunken_garden.cladding" = "brick"

[[variant]]
name = "yard-grade-brick"
description = "Planting at ordinary yard grade; full-depth brick."
assembly_swaps = { EXT_2X6_LP_PANEL = "GARDEN_FRAMED_2X6", SAUNA_LINER_ON_EXT_2X6_LP = "SAUNA_LINER_ON_GARDEN_FRAMED" }
[variant.parameters]
"sunken_garden.planting_layout" = "yard-grade"
"sunken_garden.raised_soil_height_in" = 0
"sunken_garden.cladding" = "brick"

[[variant]]
name = "yard-grade-fiber-cement"
description = "Planting at ordinary yard grade; drained fiber-cement panel screen."
assembly_swaps = { BASEMENT_BRICK_VENEER = "BASEMENT_FIBER_CEMENT_SCREEN", EXT_2X6_LP_PANEL = "GARDEN_FRAMED_2X6", SAUNA_LINER_ON_EXT_2X6_LP = "SAUNA_LINER_ON_GARDEN_FRAMED" }
[variant.parameters]
"sunken_garden.planting_layout" = "yard-grade"
"sunken_garden.raised_soil_height_in" = 0
"sunken_garden.cladding" = "fiber-cement"

[[variant]]
name = "against-wall-24-brick"
description = "30-inch bed against the court wall, 24 inches clear; brick and metal guard."
assembly_swaps = { EXT_2X6_LP_PANEL = "GARDEN_FRAMED_2X6", SAUNA_LINER_ON_EXT_2X6_LP = "SAUNA_LINER_ON_GARDEN_FRAMED" }
[variant.parameters]
"sunken_garden.planting_layout" = "against-wall"
"sunken_garden.raised_soil_height_in" = 30
"sunken_garden.planting_width_in" = 24
