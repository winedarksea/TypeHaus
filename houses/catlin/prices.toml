# ** WALL LABOUR IS NOT LESS THAN ROOF LABOUR, and the intuition that it should be is the
# trap here. ** A wall has no slope, no fall-arrest and no valleys, but it is trim- and
# opening-dominated: every window and door takes a head flashing, a sill pan, jamb trim and
# returns, and an elevation has far more of those per 100 SF than a roof plane has of
# anything. Add corners, base trim with weeps, the top termination, staging, and the fact
# that oil-canning is unforgiving on a vertical surface at eye level. On a blank elevation
# wall labour runs below roof labour; on a fenestrated one it meets or beats it.
