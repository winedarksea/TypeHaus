# deliberate blend and moves if the split does:
#   28 red-oak treads at $60-120 each. A 48" x 11-1/2" x 1" unfinished red oak tread is
#   $50-56 (floormechanics, homedepot EVERMARK, woodstairco); this profile is 1-1/2"
#   thick and up to 44" wide, so it needs the thicker blank at the top of that.
