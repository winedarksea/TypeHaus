# --- WHAT THESE NUMBERS INCLUDE ---------------------------------------------------------
# Machine-readable now, so `haus takeoff` can report material and labour separately and
# so sales tax has something to apply itself to. Every section in cli/prices.py::_SECTIONS
# must appear here — an incomplete [basis] is a hard load error, because the sections you
# did declare would otherwise read as the exceptions.

[basis]
framing              = "material"
sheet_goods          = "material"
hardware             = "material"
concrete             = "installed"
floor_heat           = "material"
placeables           = "material"
floor_finishes       = "material"
envelope_layers      = "material"
wood_surfaces        = "material"
openings             = "material"
footing_bedding      = "material"
pipe_runs            = "material"
ducts                = "material"
sleeves              = "material"
conduit              = "material"
plumbing_specialties = "material"
install_parts        = "material"
pipe_insulation      = "material"
edge_trim            = "material"
wall_structure       = "installed"
railings             = "material"
drainage             = "material"
furnishings          = "material"

# The provenance that used to live in this file's prose header. A derived number is still
# a number, but it will not reconcile line for line against a supplier list, and the
# reader is entitled to know which rows those are.

[basis_notes]
concrete        = "$/cy PLACED — ready-mix delivered plus placement labour, which is 45-55% of installed concrete, so these run roughly 2x material"
wall_structure  = "$/cy PLACED, same reason as [concrete]; derived from $/SF-of-face installed prices"
footing_bedding = "$/cy delivered — material. Spreading it is in the excavator's number, which is not in this file at all"
openings        = "material backed out of installed at 55-65%"
ducts           = "the material third of installed"
edge_trim       = "material, taken as the lower third of installed"
railings        = "material, taken as the lower third of installed"
floor_heat      = "material, backed out of published $/SF-of-floor installed prices"
