[allowances]
# ==========================================================================================
# NEW SECTION 2026-08-20 — [low, high] LUMP SUMS. Owner decision: author the whole
# missing-scope register from plans/cost-options.md into the estimate.
# ** THIS TABLE IS NOW THE ONLY COPY OF THAT REGISTER (2026-08-31, decision #66). ** The
# duplicate in plans/cost-options.md was deleted in that file's rewrite, because two copies of
# 49 lump sums drift and the copy without a loader behind it is the one that drifts silently.
# ==========================================================================================
# THE ONE TABLE IN THIS FILE WITH NO QUANTITY BEHIND IT. Every other section is a $/unit rate
# joined to something the model resolved; these are flat dollars for scope the model does not
# resolve at all. `estimate_costs` synthesises one row per key at count 1, so the number
# written here IS the line total, and the unit prints as "ls".
#
# This is not a hole in decision #28, it is the decision working. The engine still ships no
# numbers; the HOUSE says what its excavation costs, in the house's own file, exactly as it
# says what a yard of concrete costs. What changes is only that the total finally includes the
# excavator — and a total that omits the excavator is a subtotal wearing the wrong label.
#
# ** A ROW MAY NOW NAME A DRIVER (2026-08-27), and most of the block does. ** A driver is a
# numeric field on a BOM table the model already resolves:
#
#     roof-ventilated-underlayment-mat = { low = 1.00, high = 1.85, unit = "SF",
#                                          driver = "envelope_layers.net_area_sqft[material=standing-seam]" }
#
# The row stops being a lump sum and becomes RATE x MODEL QUANTITY without leaving this table,
# which is exactly right: the two facts an allowance carries are separable. "Nobody has quoted
# this scope" is still true, so it keeps an allowance's range, an allowance's cost code and an
# allowance's place in the work package. "The model cannot measure it" is no longer true, so
# the line moves when the house moves. 15 of these rows are driven and 33 are not.
#
# Grammar is "<bom_table>.<field>" with an optional [<field>=<value>,...] filter; the two
# addressable scalars are space_summary.conditioned_sf and space_summary.gross_sf; and the
# pseudo-field `rows` COUNTS rows for a table that carries no count column (panel_schedule is
# one row per circuit). ** MIND THE STACKED-LAYER TRAP: ** envelope_layers reports a LAYER, not
# a plane, so [scope=roof] sums nine layers into 12,464 SF of a 2,209 SF roof. Two filters.
#
# An undriven row is unchanged in every way: quantity 1, unit "ls", the number written is the
# line total. A driver that resolves to ZERO reports the row as unpriced rather than as $0 —
# an allowance for scope the model says does not exist is a claim the reader has to see.
#
# ** THE ONE RULE: an allowance must be scope NO OTHER SECTION PRICES. ** The BOM join that
# protects every other table from a mirror does not exist here. Drivers make a breach one line
# away — pointing at envelope_layers.net_area_sqft[material=gwb] bills the drywall twice — and
# they also brought this table its first automatic check: `haus takeoff` now lists every driven
# allowance whose quantity was measured off rows another section PRICED. It is a finding, not
# an error, and it cannot be anything else: measuring the vent mat off the standing seam's area
# is right and billing the standing seam twice is wrong, and the two drivers are the same
# shape. Twelve rows report an overlap today and every one of them is a measurement.
# Two rows from the register are deliberately ABSENT:
#
#   Rebar, $10,000-18,000.  [basis_notes] concrete says rebar is INSIDE the $/cy rates, and
