# negative under ICC-ES ESR-4729; board & batten is ~51 psf (24 ga, interpolated from Metal
# Sales' table, the only one published) and appears NOWHERE in ESR-4729. Against the -20 to
# -35 psf corner-zone demand it still passes, but the margin falls from ~4.5x to ~1.5x. Of
# eight manufacturers surveyed only WESTERN STATES ("most details in this guide are shown with
# panels attached to open framing") and METAL SALES permit open girts: McElroy lists solid deck
# only, Lyon caps furring at 18", Best Buy Metals says solid decking. Substituting any of those
# forces a second girt course or a continuous OSB layer, which costs MORE THAN THE PANEL SWITCH
# ITSELF. Western States is the assumed supplier and that is load-bearing, not a preference.
#
# ** NOT TAKEN, and priced so the choice stays open: ALL FOUR ELEVATIONS. ** Extending the
# override to the E/W walls' 1,416.6 SF is a `layer_materials` sweep and no rate change:
# +$3,700-10,000 delivered against this option's +$2,000-5,400. Also not taken: the wood-grain
# "white wood" print, which is CERAM-A-STAR SMP — a different coating system and warranty from
# the PVDF on the rest of the envelope, about as much again as the switch itself, and not
# quoted below a $3,000 job minimum.
#
# ** THE REVERT IS THE `pbr-panel-26` ROW ABOVE, which is why it is still here with its count
# updated rather than deleted. ** Reverting is deleting twenty `layer_materials=` lines; it
# restores ESR-4729 coverage and the 4.5x uplift margin, because the girts were sized for PBR.
#
# ** TRIM IS PARITY, and an earlier 2-3x figure was WRONG. ** A first pass priced board &
# batten trim at 2-3x PBR's and put the all-four-elevations premium at +$7.5k-12k. That band
# came from a blog snippet whose own concealed-panel taxonomy is flush-wall / reveal / wave —
# board & batten is never priced on that page, so applying it was category inheritance and not
# measurement. The actual install guide's trim kit is outside corner, inside corner, J-channel,
# base cap, rat guard, drip cap, F-channel: all brake-formed flat stock, all 1/2" hems, no
# cleats, no Z-closures, no closure strips. Only two pieces are B&B-specific — the band board
# (a wainscot/transition piece, NOT NEEDED HERE, panels run full height) and utility trim (a
# 2 1/2" flat strip, one bend and a hem, the cheapest profile in the set). Generic trim confirms
