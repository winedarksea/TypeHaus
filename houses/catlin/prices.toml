# ==========================================================================================
# THE BID LADDER — turned on 2026-08-20 (owner decision), except markup
# ==========================================================================================
# Until today this file declared none of [waste] / [contingency] / [markup] / [tax], so the
# ladder was flat: `subtotal_net` == `total`. That was honest but it meant the printed number
# was a NET number wearing the word "total", and nobody comparing it to a builder's price
# could see why the two were 30% apart.
#
# The order is fixed and each stage prints on its own line — see takeoff/cost_model.py:
#     net -> waste -> ordered -> contingency -> markup -> tax -> total
# They are four different people's numbers (the takeoff's, the designer's, the builder's, the
# state's) and blending them into one factor makes all four unauditable.

[waste]
# The material you buy and do not install. ** IT NEVER RIDES ON LABOUR. ** You buy 110 SF of
# board to install 100 SF and throw 10 SF away; you do not pay the installer 10% more for it,
# because an installed labour rate is quoted per square foot of FINISHED area and already has
# normal cutting inside it. (takeoff/cost_model.apply_waste enforces this. It did not, until
# 2026-08-20: 41% of this house's waste — $10,531-19,796 — was being added to labour, which is
# what made waste and contingency look like the same stage charged twice. They are not: waste
# is a QUANTITY fact about material, contingency is an UNKNOWNS fact about scope.)
#
# The one admitted exception is a MERGED row: an installed price with no declared split cannot
# have its material half identified, so the factor rides on the whole number. [concrete] and
# [wall_structure] are the two. Waste over-applies slightly there, exactly where sales tax
# under-applies — declaring a split would fix both at once.
#
# Deliberately NOT declared on framing, sheet_goods,
# floor_finishes or wood_surfaces: those four are billed on an ORDER quantity that already
# carries their waste, and the loader makes a [waste] entry on one of them a hard error rather
# than a silent double-count (cli/price_file.WASTE_IN_QUANTITY).
#
# Nor is it declared on openings, placeables, sleeves, plumbing_specialties, install_parts or
# allowances. You do not over-order a window, a heat pump or an excavator; a wasted one is a
# mistake, not a rate, and that is what [contingency] is for. Omission here is a claim, not
# an oversight.
concrete             = 0.05   # short-load and over-order on ready-mix; you cannot buy 0.4 cy
wall_structure       = 0.05   # same, plus block breakage on RETAINING_BLOCK_12
footing_bedding      = 0.10   # aggregate compacts and is lost into the subgrade
envelope_layers      = 0.10   # board cuts, membrane laps, and the offcut at every opening
edge_trim            = 0.10   # trim is cut from stock lengths and the drop is not reusable
freeze_protection    = 0.05   # cable is cut from a reel and the tails are short; the controller is a piece, not a length
member_protection    = 0.10   # tape comes in 50' rolls and the tail of one is not the start of the next; laps eat a little more
pipe_insulation      = 0.10   # split sleeve cut to fittings
construction_returns = 0.10   # short pieces cut from stock: sill, channel, blocking
floor_heat           = 0.05
hardware             = 0.03   # the box of connectors nobody counts back in
pipe_runs            = 0.05
ducts                = 0.05
conduit              = 0.05
railings             = 0.05
drainage             = 0.05

[contingency]
# 10% on the ordered subtotal. Design contingency, not a slush fund: this house is modelled to
# a level of detail most estimates never reach, and it is EXACTLY that detail which makes 10%
# the right number rather than the 15-20% a schematic-design estimate needs. What it covers is
# the scope this file provably cannot see at the line level — the fastener nobody counted, the
# detail that gets built twice, the subgrade that comes up wetter than the boring said.
# It does NOT cover missing scope; that is [allowances], directly above.
rate = 0.10

[markup]
# ** DELIBERATELY ZERO, and present so it is one edit to turn on. ** The owner's call
# 2026-08-20 was to leave the general contractor's overhead and profit out of the line-item
# total, on the reasoning that what this file adds up is a subcontractor sum, and a GC's fee is
# a contracting decision rather than a cost of the building.
#
# The two are separate stages because they compound in a fixed order: profit is taken on
# (ordered + contingency + overhead), not on the bare subtotal. Typical Twin Cities custom
# residential is overhead 0.08-0.12 and profit 0.05-0.10 — call it 15-20% combined. On this
# house that is roughly $100k-230k, which is why it is a decision and not a default.
# To turn on: set the two numbers. Nothing else in this file needs to change.
overhead = 0.0
profit   = 0.0

[tax]
# ** MATERIAL ONLY. ** In Minnesota a contract to improve real property is not itself taxable
# and construction LABOUR is exempt; the contractor is the end user of the materials and pays
# sales and use tax on them at purchase (MN DOR Sales Tax Fact Sheet 128, Contractors). That
# asymmetry is the entire reason [basis] exists, and the 2026-08-20 material/labour split pass
# is what makes this entry mean anything — before it, $88k-167k of the total was merged and
# unreachable by tax.
#
# ** SET TO SUBURBAN HENNEPIN, 8.525% ** (owner, 2026-08-20) — 6.875% state + 0.15% Hennepin
# County + 1.5% metro-area special district. To move the site, swap which line is commented;
# nothing else in this file depends on which one is active:
#
#     material_rate = 0.09025   # City of Minneapolis (the above +0.5% city sales tax)
#
# NOTE the asymmetry this leaves, deliberately and visibly: every LABOUR rate in this file was
# localised to MINNEAPOLIS wages, and those do NOT drop at the city line — suburban Hennepin is
# the same labour market. Only the tax is jurisdictional. If the site ever moves out of the
# metro entirely, both need revisiting, and the labour side is the larger of the two.
#
# `haus takeoff` still prints how much of the base tax could NOT reach, because it sits in
# merged installed rows ([concrete], [wall_structure], and the seamless-gutter row that says
# why). That figure is the honest measure of how much declaring more splits would be worth.
material_rate = 0.08525   # suburban Hennepin County  <- ACTIVE

[tax_included]
# ** WHICH MATERIAL PRICES ALREADY HAVE SALES TAX IN THEM. ** New 2026-08-20, and the reason
# it exists is a real double-count that was found by asking where each rate came from.
#
# THE CONVENTION FOR THIS FILE IS PRE-TAX. Every price should be a number you could read off a
# shelf, a yard's quote sheet or a manufacturer's list — tax excluded, and added once by the
# [tax] stage above. That is what a shelf price IS, so most rows need nothing here.
#
# The exception is any material rate BACK-DERIVED FROM A PUBLISHED INSTALLED COST. A HomeGuide
# or Angi "installed" figure is a contractor's price to a homeowner, and in a materials-taxing
# state the contractor has already paid the tax and passed it through inside that number. Take
# a material share out of it and the share carries the tax with it. Taxing it again is pure
# double-count — about $4,000-11,000 on this house before these entries.
#
# Two things to know when adding a row here:
#  1. It is a BOOLEAN. "Does this number already have tax in it" is a question with an answer;
#     "what effective rate is buried in this national average" is not, and the loader refuses a
#     float so nobody is tempted to invent one. What is skipped is reported by `haus takeoff`
#     rather than absorbed, exactly like the merged figure beside it.
#  2. IT IS THE SECOND-BEST ANSWER. The best one is to re-source the rate from a pre-tax list
#     price, which deletes the entry. `openings` is the live example — it is flagged below and
#     is being re-sourced from manufacturer list prices; when that lands, its line comes out.
#
# NOT FLAGGED, and each for a checked reason: [framing] and [footing_bedding] are yard and
# MnDOT bid prices; [placeables] is retail device/appliance listings; [sheet_goods] and most of
# [envelope_layers] are per-sheet and per-SF shelf prices; [hardware] is Simpson list.
# [concrete] and [wall_structure] were the likeliest tax-inclusive rates in the whole file and
# needed no entry while they were MERGED, because the tax stage cannot reach a merged row. That
# shield came off on 2026-08-27 when their largest rows were split, and it was replaced rather
# than lost: those splits take their MATERIAL half from a pre-tax ready-mix / delivered-block
# quote and leave labour as the residual, which is the "re-source it from a pre-tax list" fix
# note 2 below calls the better answer. So still no entry — but for a new reason, and a split
# row added here on a back-out PERCENTAGE instead would need one.

# (openings was flagged here on 2026-08-20a and the flag is GONE as of 2026-08-20b: the
# section was re-sourced from pre-tax shelf and manufacturer list prices, which is the better
# fix the note here always said it was. Do not put it back without re-reading that header.)

# HomeGuide / Angi 2026 flooring cost charts, which are installed prices.
floor_finishes = true

# Only the SPLIT allowance rows have a material bucket at all (the rest are merged and
# unreachable by tax anyway), and each had its material share taken out of an installed
# industry figure: excavation, the driveway, interior trim and paint. (The PV array and the
# branch-circuit conductors were two more until 2026-08-27, when both left this table for
# sections of their own — see [solar_modules] below for where the PV flag went, and
# [conductors], whose rates are pre-tax cable prices and so needs none.)
allowances = true

# $/W back-derived from an installed residential PV price, exactly as the allowance it
# replaced was. Re-sourcing from a module list price and a separate racking price is the
# better fix and would take this line out.
solar_modules = true

[basis]
framing              = "material"
sheet_goods          = "material"
hardware             = "material"
concrete             = "installed"
floor_heat           = "material"
placeables           = "material"
floor_finishes       = "material"
envelope_layers      = "material"
wood_surfaces        = "material"
openings             = "material"
footing_bedding      = "material"
pipe_runs            = "material"
pipe_fittings        = "material"
ducts                = "material"
duct_fittings        = "material"
duct_insulation      = "material"
sleeves              = "material"
conduit              = "material"
conductors           = "installed"
solar_modules        = "installed"
data_raceways        = "installed"
plumbing_specialties = "material"
install_parts        = "material"
pipe_insulation      = "material"
edge_trim            = "material"
freeze_protection    = "material"
member_protection    = "material"
wall_structure       = "installed"
timber               = "material"
railings             = "material"
drainage             = "material"
construction_returns = "material"
sill_gaskets         = "material"
furnishings          = "material"
allowances           = "installed"

# The provenance that used to live in this file's prose header. A derived number is still
# a number, but it will not reconcile line for line against a supplier list, and the
# reader is entitled to know which rows those are.

[basis_notes]
duct_fittings   = "material only, and derived rather than quoted, exactly as [pipe_fittings] is: an elbow is counted off the run's own 3D polyline, so the count is geometry and the rate is a catalogue price. No tees — there is no parent inference for an air-side system the way drain_tie_ins gives one for drainage, and a radial install barely has any"
pipe_fittings   = "material only, and derived rather than quoted — see the table's own note. Its arrival RE-BASED [pipe_runs] drain/vent to bare pipe; restoring the old fitting adder there would double-bill every elbow in the house"
concrete        = "$/cy PLACED. Merged everywhere until 2026-08-27, when the three largest rows (footing, slab, drain_tile's siblings aside) gained a REAL split — and the rule that produced them is the one that kept the rest merged: the MATERIAL half is an independently sourced pre-tax number (Twin Cities ready-mix $180-200/cy, wire mesh $0.20-0.50/SF, rebar) and the labour half is the residual. That is a back-out, and it is honest only in that direction. A percentage guess at the split would read exactly like a real one, which is why the smaller rows still carry none. Raised across the board 2026-08-20; slab-on-grade was ~2.5x low and drain_tile ~5x"
timber          = "$/cy, but built from $/LF and shown divided in every row's comment — the join measures volume and lumber is bought by the foot. Material and labour are split because a stick of LVL is a purchase and hanging it is a wage, unlike the merged pours in [concrete]"
wall_structure  = "$/cy PLACED. The five largest rows are SPLIT since 2026-08-27 on the same rule as [concrete] — material sourced pre-tax (ready-mix, rebar, and for GARAGE_ICF_6 the ICF blocks at $5-7/SF of face, which is why that row is over half material where a site-formed wall is under a third), labour the residual. RETAINING_BLOCK_12 is split off a delivered block-and-geogrid price and contains no ready-mix at all. The remaining rows stay merged. Derived from $/LF-of-wall and $/SF-of-face installed prices. RETAINING_BLOCK_12 and BASEMENT_BRICK_VENEER (including its per-material rows BASEMENT_BRICK_VENEER:brown-brick / :glazed-lapis-brick / :glazed-gold-brick) contain no ready-mix at all and must not be escalated with a concrete index. GARAGE_BRICK_WAINSCOT is the same case and the same warning. GARAGE_ICF_6_BRICKLEDGE is NOT — it is mostly ICF wall, and its rate is struck across the core row and the brick-ledge band row together, which share one key"
footing_bedding = "$/cy delivered — material only. Spreading and compacting is in the excavator's number, which is not in this file. Confirmed 2026-08-20 against MnDOT 2025 average bid prices"
openings        = "material and labour are now SEPARATE quantities. The old single 55-65% back-out factor is gone: the real material share runs 70-85% for windows, 60-70% for exterior doors, 40-55% for interior doors and 10-25% for a cased opening"
hardware        = "material only, and deliberately so — the labour to drive a screw or set a hanger is inside the [framing] labour rate. HUCQ410-SDS is the exception and says why"
conductors      = "material plus installed labour, per CONDUCTOR-foot — NOT per cable-foot. Derived by dividing a published $/ft of 12/2, 10/3 and 8/3 NM-B by the conductors in the cable, because the takeoff measures conductor-feet. The QUANTITY is the weak half, not the rate: mean_pull_ft is the mean power-raceway run + 10 ft, a conservative proxy for a branch pull, and it reads about a fifth of the cable-feet the retired allowance assumed"
solar_modules   = "$/W DC installed, split 65/35 on the industry norm. Modules, racking and rapid shutdown ONLY — the inverter, battery and PV junction box are placed elements and bill in [placeables]. The high end is a small-array premium: permitting, interconnection and design are near-fixed and this array is 5.28 kW"
data_raceways   = "material plus installed labour, $/LF of EMPTY PIPE. It is not the drops: cable, boxes, jacks and termination are the driven electrical-structured-low-voltage-drops allowance. Disjoint from [conduit] by construction — conduit_takeoff and data_raceway_takeoff partition model.conduits on service"
ducts           = "material plus installed labour, UN-BLENDED 2026-08-27 by qualifying on `material` and 2026-08-30 by qualifying on `diameter_in` as well: `supply:semi_rigid:3.0` is the 75 mm radial, `supply:semi_rigid:6.0` the 6-inch riser, and a bare `supply` the 14x8 galvanized trunk, which the model leaves unnamed. Lookups fall back through the shorter keys, so the `material`-only and bare rows still price anything the finer rows do not name. The 08-27 blend it replaces was a sheet-metal rate carried over the radial pass, so the section fell rather than rose; the 08-30 diameter split is rate-neutral on today's mix and exists so it stays right when the mix moves"
edge_trim       = "material plus installed labour. Two rows, drip_flashing and ridge_cap, are commonly inside a roofer's price — check for a double count against any roofing bid"
freeze_protection = "material plus installed labour, and the material half carries a share of the thermostat/controller because 10.8 LF cannot support a line item of its own. Excludes the cable down TR-SG-LEADER-SE, which is a Downspout and not a PipeRun — see notes/heat_pump_deck_mounting.md"
member_protection = "material plus installed labour. Applied by the framer WITH the framing, not by a trade on a return visit — five of the seven capped beams carry joists on top, so the tape and the cap over it go on before the deck frames or not at all"
railings        = "material plus installed labour. RAILING-INT-STAIR-GUARD is priced as a COMPONENT system; a shop-welded guard moves cost from labour into material and the two models must not be stacked"
drainage        = "material plus installed labour, BLENDED over two products that differ 3x (seamless K-style vs fabricated box gutter). Seamless is roll-formed on site, so its own split is inseparable and every quote will come back merged"
floor_heat      = "material plus installed labour, backed out of published $/SF-of-floor prices. The 3 floor sensors are not in it"
floor_finishes  = "material plus installed labour on the ORDER quantity. carpet-pad carries labour = 0 on purpose: laying the pad is inside the carpet rate"
placeables      = "unit price plus INSTALL labour. Rough-in is billed by the foot in [pipe_runs], [ducts] and [conduit]; branch-circuit conductors are in neither and are the largest single omission in the file"
envelope_layers = "material plus installed labour, $/SF net. Labour is ~60% of this section — standing-seam roofing, drywall finishing and painting are all labour-dominated trades. The metal skin is SEVEN rows keyed on fixing method, seam profile and gauge, not one: mechanical seam, snap lock, nail strip, 26 ga nail strip, 26 ga exposed-fastener PBR, 7/8 in corrugated and 24 ga concealed-fastener board & batten differ by up to $4.50/SF of LABOUR and must never be re-merged. The two EXPOSED-fastener rows are the odd ones out and the split matters beyond labour: PBR and corrugated are the wall panels whose FIXINGS are billed as a separate counted part ([hardware] T09150HWAM, 1,804 screws), because a face-fastened panel opts in via Material.exposed_fastener. Every other row, board & batten included, has its clips and fixings inside its $/SF rate. Folding those screws back into this section, or adding a screw count against any of the concealed rows, double-bills them"
framing         = "material plus installed labour, $/LF of ordered stock. Add 10-15% for framing general conditions (mobilisation, bracing, layout, hardware, punch-out), which no per-unit rate captures"
