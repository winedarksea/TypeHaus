# --- WHAT THESE NUMBERS INCLUDE ---------------------------------------------------------
# Machine-readable now, so `haus takeoff` can report material and labour separately and
# so sales tax has something to apply itself to. Every section in cli/prices.py::_SECTIONS
# must appear here — an incomplete [basis] is a hard load error, because the sections you
# did declare would otherwise read as the exceptions.

[allowances]
# ==========================================================================================
# NEW SECTION 2026-08-20 — [low, high] LUMP SUMS. Owner decision: author the whole
# missing-scope register from plans/cost-options.md into the estimate.
# ==========================================================================================
# THE ONE TABLE IN THIS FILE WITH NO QUANTITY BEHIND IT. Every other section is a $/unit rate
# joined to something the model resolved; these are flat dollars for scope the model does not
# resolve at all. `estimate_costs` synthesises one row per key at count 1, so the number
# written here IS the line total, and the unit prints as "ls".
#
# This is not a hole in decision #28, it is the decision working. The engine still ships no
# numbers; the HOUSE says what its excavation costs, in the house's own file, exactly as it
# says what a yard of concrete costs. What changes is only that the total finally includes the
# excavator — and a total that omits the excavator is a subtotal wearing the wrong label.
#
# ** THE ONE RULE: an allowance must be scope NO OTHER SECTION PRICES. ** The BOM join that
# protects every other table from a mirror does not exist here, and nothing in the loader can
# catch a double-count. Two rows from the register are therefore deliberately ABSENT:
#
#   Rebar, $10,000-18,000.  [basis_notes] concrete says rebar is INSIDE the $/cy rates, and
#                           those rates were raised on 2026-08-20 on exactly that assumption.
#                           Authoring it here would bill ~5 tons of steel twice. If the
#                           decision is ever reversed, take it out of the concrete rates the
#                           same day — the register entry says this is a decision that should
#                           be made explicitly, and leaving it out here is that decision.
#   GC overhead and profit, $100,000-375,000.  That is the [markup] stage, which the owner
#                           deliberately left at zero. Putting it here would turn on, through
#                           a side door, the one thing that was explicitly turned off — and
#                           worse, it would take contingency and tax on a builder's fee.
#
# Ranges are the register's own, unaltered, so the two documents reconcile line for line:
# site $71,700-183,500 (after rebar) + envelope $39,855-121,760 + MEP $62,135-145,990 +
# finishes $42,800-129,000 + general conditions + soft costs = $271,490-720,250.
#
# ONE THING TO KNOW ABOUT THE LADDER: [contingency] at 10% applies to these rows too, because
# it applies to the ordered subtotal as a whole. For a line already carrying a 2x range that
# is arguably belt-and-braces. It is left that way rather than special-cased, because a
# contingency that skips the least-certain third of the estimate is not a contingency.
#
# Most rows are MERGED (the section basis is "installed") — a lump sum for scope nobody has
# quoted has no honest split, and inventing one would read exactly like a real one. The five
# largest are split, because at $24k-46k the difference between taxing all of it and taxing
# the modules only is real money, and for those five the material share is a known industry
# figure rather than a guess.

