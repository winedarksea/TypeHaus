# prices.toml — unit prices for the catlin house (none supplied yet).
#
# Type:Haus ships NO default prices: material cost is local, seasonal, and negotiated.
# Every row below is a COMMENTED placeholder keyed from the house's own bill of materials
# (`haus takeoff` / cli/prices.py ESTIMATE_PLANS) — uncomment a row and fill in a real
# number (`KEY = 1.23`) or a quote range (`KEY = { low = 1.0, high = 1.5 }`) to have
# `haus takeoff` and the BOM view price that line. Rows left commented stay honestly
# UNPRICED in the estimate; they are never priced at zero.
#
# Cost tracking (paid check-offs, exact products, actual $) lives in costs.toml, keyed by
# the same (section, key) join used here.

