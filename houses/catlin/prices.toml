# ** RE-SOURCED FROM PRE-TAX LIST PRICES, 2026-08-20b. ** This section previously derived its
# material prices by backing them out of published INSTALLED costs at "roughly 55-65%", which
# was wrong twice over: a back-out percentage is a guess layered on an aggregate, and a
# published installed cost is a contractor's price to a homeowner with MN material sales tax
# already inside it — so [tax] was charging it a second time. Both are fixed. Every number
# below is a shelf or manufacturer list price, tax excluded (Home Depot, Pella's own shop and
# the window e-tailers all display pre-tax and compute tax at checkout), which is what this
# file's stated convention wants. The `openings = true` entry in [tax_included] is DELETED as
# of this pass — it is no longer needed and would now under-tax the section.
#
# ** THE FINDING THAT MATTERS MOST: WINDOWS ARE PRICED BY UNITED-INCH BAND, NOT BY AREA. **
# The only fully structured manufacturer price list obtainable (Simonton Prism Platinum
# casement, thehouseofwindows.com) charges ONE FLAT BASE PRICE for everything from 0 to 71
# united inches, and only adds a surcharge above that (+$251.68 at 72-101 UI). WT-1424 (38 UI),
# WT-1448 (62), WT-2736 (63) and WT-3036 (66) are ALL IN THAT FIRST BAND and should all cost
# about the same. A 14x24 is not 60% of a 27x36; it is 100% of it. The old table had the small
# units at half the price of the mid ones, and that spread was fiction — those five rows were
# 65-85% LOW, which is the single largest correction in this file since labour was added.
# Everything else here moved 10-25%, which is an ordinary revision.
#
# THREE UNITS ARE BELOW A STOCK LINE'S MINIMUM SIZE and may not be orderable as priced:
#   WT-1424 (14" wide) — Simonton's AWNING minimum is 23.5" wide. A 14x24 awning is a
#                        specialty unit, and there are eleven of them (6 + 5 tempered).
#   WT-1864 (18" wide) — narrower than Andersen 400's narrowest casement (20-11/16"). May
#                        force a different series.
#   WT-1448 (14x48)    — a legal casement at a 3.4:1 aspect, but an odd one; expect the band
#                        floor, never below it.
# ** VERIFY AVAILABILITY BEFORE BIDDING THESE. ** An unavailable size is not a price problem.
#
# TEMPERED IS A FLAT ADDER, NOT A PERCENTAGE. The old file assumed 30-40%, which happens to
# land near-right on a mid-size unit and is wrong at both ends. Retailers bill $257-281 flat;
# a dealer option list is nearer $100-180; the raw glass cost on a 13.5 sf unit is $27-68 at
