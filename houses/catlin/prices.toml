# THE CODE MINIMUM ONLY — eaves to 24" inside the wall line, plus valleys, per MN. CONFIRMED
# AS BASE SCOPE by the owner 2026-08-20, and for a stated reason rather than to save money:
# this roof is a highly insulated assembly under a low-friction standing seam over a quality
# full-field underlayment (now the modelled synthetic layer, see above), which is the combination that
# stops an ice dam FORMING — little heat reaching the deck to melt snow, and a slick surface
# that sheds what does melt. Full-deck membrane is insurance against a dam that has already
# formed; the assembly is the primary defence and it is the one being paid for.
# The full-deck high-temp alternative is $17,400-38,300 and stays an UPGRADE entry in
