#   poured 8" wall    $110-180/LF of a 9'-0" wall is the market's OWN quote (the 12" row above
#                     is the extrapolation, not this one). The wall is **8'-0"** since the
#                     2026-08-23 flat-bearing-seat rework, not the 9'-4" it was, so the quote
#                     scales DOWN: $98-160/LF over 0.1975 cy/LF -> $495-810/cy. The $/cy is
#                     unchanged, which is the point of quoting per cubic yard — the wall lost
