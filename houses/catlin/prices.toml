# ** THE BIGGEST LINE IN THE HOUSE, and as of 2026-08-20 it is FOUR lines. ** One
# `standing-seam` row used to carry all 6,322 SF at one rate. That was wrong in a specific,
# expensive way: it billed the whole house at the mechanically-seamed roof's labour, and
# mechanical seaming is the dearest metal install there is. The house wears the same white
# 24 ga PVDF steel almost everywhere; what differs is the SEAM PROFILE, and the profile is
# almost entirely a LABOUR fact.
#
#   mechanically seamed  a powered seamer makes a second pass down every seam, folding it
#                        180 degrees over the clip. +$1.50-3.00/SF of labour, ~+50% crew
#                        hours (6-9 man-hr/SQ against 4-6), plus a seamer: $90-150/day or
#                        $350-650/week to rent in the Midwest, $250-450 freight each way,
#                        $8,000-15,000 to buy. On a roof this size the rental alone is
#                        $0.60-0.90/SF, which is why the premium is real at house scale and
#                        vanishes at commercial scale.
#   snap-lock            the same concealed floating clips, but the male and female legs
#                        engage under hand pressure. No seamer, no second pass.
#   nail strip           NO CLIPS AT ALL — an integral flange face-fastened to the deck,
#                        the next panel's leg snapping over it. Drops the clip material AND
#                        the clip-setting labour; the fastest standing seam to install.
#
# MATERIAL is the smaller half of the story and is not ordered the way intuition says:
# Steeldash's published list has 24 ga PVDF snap-lock and 24 ga PVDF nail strip at the same
# $4.60/SF, and FoxHaven states plainly that mechanical-seam panel stock runs at or BELOW
# snap-lock (a snap-lock's interlock geometry is the more complex roll-form; a seamed panel
# is a simpler open leg folded in the field). So DO NOT budget a material premium for the
# seamed roof. The material spread below is gauge and trim load, not seam type.
#
# Sources: Western States Metal Roofing (snap-lock vs mechanically seamed; nail strip vs
# snap lock; 24 vs 26 gauge; metal siding cost), Sheffield Metals learning centre (nail strip
# $5-11/SF installed, snap-lock $6-14, mechanically seamed $7.50-17), Steeldash published
# panel list, McElroy Metal seamer rental, Owl Roofing / Ascension / Earth Friendly Builders
# for Twin Cities installed rates, Fixr and HomeGuide metal siding 2026.
#
# ** WALL LABOUR IS NOT LESS THAN ROOF LABOUR, and the intuition that it should be is the
# trap here. ** A wall has no slope, no fall-arrest and no valleys, but it is trim- and
# opening-dominated: every window and door takes a head flashing, a sill pan, jamb trim and
# returns, and an elevation has far more of those per 100 SF than a roof plane has of
# anything. Add corners, base trim with weeps, the top termination, staging, and the fact
# that oil-canning is unforgiving on a vertical surface at eye level. On a blank elevation
# wall labour runs below roof labour; on a fenestrated one it meets or beats it.
#
# 1,430.3 SF — RF-HOUSE, CATLIN_ROOF. Installed $10.50-18.50/SF, against $10-18 national and
# $12-22 Minnesota for mechanically seamed. This is the roof that carries the PV array and
# sheds onto occupied ground; the seam is the reason it is not being re-roofed in 25 years.
"standing-seam" = { material = { low = 3.5, high = 6.5 }, labour = { low = 7, high = 12 } }
