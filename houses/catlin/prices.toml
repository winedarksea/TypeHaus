# mygravelbuddy.com delivered #57 pricing.
# $/cy, by aggregate spec
# 2026-08-20 — CONFIRMED and tightened, on the best-sourced data in this file. MnDOT 2025
# Average Bid Prices: Coarse Filter Aggregate (CV) $81.24/CY and Coarse Aggregate Bedding (CV)
# $65.21/CY — and those are IN-PLACE prices (furnish, haul, place, compact), so the old $85
# high END EXCEEDED MnDOT's placed price for delivered-only stone. Tightened rather than
# raised. Conversion: 1.4 tons/cy (Yellow Medicine County 2025 bid packet states it verbatim;
# reconciles with 97 cy / 135 tons = 1.39).
# 97 cy is 135 tons = 6-9 tandem loads, so this is full-truckload pricing with no minimum-load
# surcharge — the one aggregate line where the quantity works in the house's favour. Order it
# as ONE release across consecutive days, not as separate calls.
