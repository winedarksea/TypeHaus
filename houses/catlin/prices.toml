# 2026-08-20 — the placeholder is RESEARCHED NOW, and it was right. MnDOT 2025 Average Bid
# Prices: Aggregate Base (CV) Class 5 = $32.01/CY across 37 contracts and 236,174 CY, in place.
# The multi-year series is flat: 2022 $32.46, 2023 $33.46, 2024 $44.63 (a mix-of-projects
# artifact), 2025 $32.01. A delivered-only metro price just under the in-place figure is
# exactly consistent, so the band tightens to $26-40 rather than moving. At 1.4 tons/cy that
# is $18-26/ton; the FOB-pit anchor is $8.00-11.25/ton (rural W. Minnesota, six bidders), and
# the gap between the two IS the trucking.
# ** THE RATE IS NOT THE PROBLEM — THE QUANTITY IS. ** 3.03 cy is 4.4 tons, under half a
# tandem, and no supplier sells that. Plaisted (Elk River) lists Class 5 at $19.95 with
# delivery charged PER ORDER at $150-485 by zone, and states Class 5 cannot be ordered
# standalone for delivery at all — it must ride with another bulk order. The true cost of this
# line is $150-400, not the $79-121 the rate produces. The fix is logistical, not numeric:
# fold the Class 5 into the #57 delivery above and it costs almost nothing extra.
#
# PRICED AS A STANDALONE DELIVERY, because the model cannot know the logistics and the
# standalone case is the one that actually gets ordered. Supplier-verified 2026:
#   conversion   Plaisted publishes 2,000 lb/ton and 2,800 lb/cy -> 1.40 ton/cy, so 3.03 cy
#                is 4.24 tons loose. (Not a rule of thumb — their own published figure.)
