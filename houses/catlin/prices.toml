#   -> $140-275 delivered = $46-91/cy. FREIGHT IS 60-80% OF THE INVOICE at this quantity,
#      which is why the rate below is nothing like the $32.01/CY MnDOT pays at bid volume.
# The delivery fee cannot honestly be divided into material and labour, so this row stays a
