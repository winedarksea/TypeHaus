# The stair members, repriced 2026-08-08b now that species is settled: RED OAK everywhere
# except the basement flight (ST-B2M), which is heavy-duty carpet over a plain substrate.
# `stair_finish` splits the three flights — ST-B2M 11 treads, ST-M2S 13, ST-S2A 15 — but
