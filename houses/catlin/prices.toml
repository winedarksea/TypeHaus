# bulk, and `structural_solids` is the only table that bills them at all, so a $/cy here
# is the only way they reach the estimate. Each is converted from its real trade unit:
#   drain_tile  4" perforated corrugated HDPE with sock at $1.00-1.60/LF. The solid is
#               modeled as a 4x4 section = 0.111 cf/LF, so $/cy = $/LF x 243. The 744.4 LF
#               `footing_bedding` reports independently (296.0 to DRW-SG-MAIN + 448.4 to
#               daylight, re-measured 2026-08-30) is what the $/cy is carrying; the "804 LF
#               matches 803 LF" reconciliation this line used to quote had gone stale on
#               both sides.
#   drywell     the `drainage` rows say the drywells ARE #57 washed stone (4.83 cy of it),
#               so this is the [footing_bedding] stone rate plus the chamber and fabric.
#   sump        one radon sump pit at 0.19 cy. $/cy looks absurd because the unit is
#               absurd for a single moulded basin: $150-400 for the pit and cover, over
#               0.19 cy. The line total, ~$130-400, is the number that matters.
#
# Everything else in structural_solids is thin-gauge metal or a marker solid that bills
# primarily elsewhere — price the pours here, not the aluminium.
#
# 2026-08-08b — four of the five families that had no billing path anywhere now have one,
# so they stay blank here for the ordinary mirror reason rather than for lack of a table:
