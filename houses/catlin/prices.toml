# The ventilated mat under the standing seam has the opposite problem: it IS modelled
# (CATLIN_ROOF's `vent-mat`), but an AIRGAP layer is deliberately excluded from the envelope
# takeoff — the engine assumes a gap is framing and bills it through the cut list, which is
