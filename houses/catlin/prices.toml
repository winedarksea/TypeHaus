# prices.toml — unit prices for the catlin house.
#
# Type:Haus ships NO default prices: material cost is local, seasonal, and negotiated.
# Every row below is keyed from the house's own bill of materials (`haus takeoff` /
# cli/prices.py ESTIMATE_PLANS). A row carries either a real number (`KEY = 1.23`) or a
# quote range (`KEY = { low = 1.0, high = 1.5 }`); rows left COMMENTED stay honestly
# UNPRICED in the estimate and are never priced at zero.
#
# Cost tracking (paid check-offs, exact products, actual $) lives in costs.toml, keyed by
# the same (section, key) join used here.
#
# EVERY NUMBER IN THIS FILE IS A RESEARCHED ESTIMATE FOR BUDGETING, not a quote. Five
# research passes so far: 2026-08-07 (framing, sheet goods, concrete, envelope layers,
# openings), 2026-08-08a (everything else), 2026-08-08b (owner answers: stair species,
# railings, drainage, the Gree line, the furnishings split), 2026-08-20, and 2026-08-21
# (the twelve FX-* plumbing-fixture rows, after the tub-shower was found priced below the
# bare tub on both halves). Each section header carries its own basis and sources.
#
# --- WHAT THE 2026-08-20 PASS DID ---------------------------------------------------------
# It added LABOUR. Before it, 21 of the 24 sections were material-only and the estimate
# reported $0 of labour against $218k-461k of material — a shopping list, not a cost. Now
# almost every row carries an explicit { material = ..., labour = ... } split and the three
# basis subtotals are all non-zero. The construction total moved $306,982-627,214 ->
# $574,980-1,135,114, and essentially none of that is the house changing: it is labour that
# was always going to be paid arriving in the file.
#
# It also corrected the material rates, in BOTH directions. The 2026-08-07 lumber numbers ran
# 25-75% over 2026 yard list (framing lumber is flat-to-down year on year — the composite was
# $558.19/mbf on 7 Aug 2026, -2.6% YoY — so there is no tariff spike to carry, despite the
# 35.16% AD/CVD plus 10% Section 232 stack on Canadian stock). Against that, I-joist was 25-35%
# LOW, LVL was low by 2-3x, standing-seam metal was 40% low at the bottom, mineral wool 35%
# low, and the ceiling gypsum row was pricing 1/2" board against a 5/8" quantity.
#
# Three structural findings are recorded where they belong rather than here: the suspended
# deck's low end is commercially unobtainable (see slab:CATLIN_DECK_EPS_INT), drain_tile was
# ~5x low, and slab-on-grade was ~2.5x low. And the single 55-65% "back out material from an
# installed price" factor used by [openings] is gone — the real material share runs 40% to
# 82% depending on the article, so labour is now carried as its own explicit quantity.
#
# --- WHAT THE SECOND 2026-08-20 PASS DID (owner decisions) --------------------------------
# The list that used to sit here began "WHAT IS STILL NOT IN THIS FILE, and it is a lot" and
# named excavation, pumping, waterproofing, roof underlayment, branch-circuit conductors, the
# PV array, utility connections, permits and general conditions. IT IS IN THIS FILE NOW. On the
# owner's decision the whole missing-scope register from plans/cost-options.md was authored
# into the new [allowances] table -- 48 lump sums -- and three of the four bid-ladder stages
# were turned on. Read those two blocks' own headers before changing either.
#
# Three things are still deliberately out, and each says why where it lives: REBAR (it is
# inside the [concrete] $/cy rates -- see [basis_notes] -- so an allowance would bill it
# twice), GC OVERHEAD AND PROFIT (that is [markup], deliberately zero, ~$130k-375k if taken),
# and the full-deck ice-and-water membrane (an upgrade, not base scope).
#
# Two price-model refactors landed with them, and both are legibility rather than money:
# a row may now name its own UNIT (`unit = "ea"`, cli/price_file.ALTERNATE_UNITS) instead of
# being priced by the cubic yard because that is the only field its table joins on; and
# [drainage] is qualified by PRODUCT, so a seamless aluminium gutter and a fabricated box
# gutter are two keys rather than one blended average of things that differ 3x.
#
# --- THE PRICE CONVENTION: PRE-TAX, PRE-DELIVERY, PER UNIT --------------------------------
# ** EVERY PRICE IN THIS FILE IS QUOTED WITHOUT SALES TAX. ** Tax is not a property of a rate,
# it is a stage of the bid ladder ([tax], below), applied once to the material portion at the
# end. Write what you could read off a shelf, a yard's quote sheet or a manufacturer's list.
#
# The trap this convention exists to avoid: a great deal of published residential cost data is
# an INSTALLED figure from a homeowner-facing cost guide, and that is a contractor's price to a
# homeowner with the material tax already inside it. Back a material share out of one and the
# share carries the tax along. Where a rate could not be re-sourced pre-tax, it is named in
# [tax_included] and the tax stage skips it — see that table, which also explains why the flag
# is a boolean rather than a rate, and why re-sourcing is always the better fix.
#
# DELIVERY AND FREIGHT ARE ALSO NOT IN THESE RATES, and that is a real gap rather than a
# convention worth defending. A shelf price is at the shelf; getting 10,700 LF of 2x6, 45
# special-order windows and a roof's worth of standing-seam panel to a site is a cost. It is
# carried as an [allowances] row rather than a per-rate loading, because it is a per-ORDER cost
# and loading it onto a $/LF rate would make the rate wrong for anyone comparing it to a quote.
#
# ONE PLACE THE CONVENTION BENDS, deliberately: a few rows are genuinely sold only as an all-in
# installed lump — seamless K-style gutter is roll-formed on site from coil, so no separated
# material price for it exists anywhere. Those rows are `basis = "installed"`, report as MERGED,
# and are never divided into an invented split. `haus takeoff` prints how much of the total sits
# in merged so a reader can see how much of the estimate is on that footing.
#
# --- MATERIALS OR INSTALLED? -------------------------------------------------------------
# This used to be four paragraphs of prose that no consumer could read. It is now the
# [basis] and [basis_notes] tables at the bottom of this file, and the estimate reports
# three subtotals off them: material, labour, and merged (an installed row whose split is
# not known). A merged number is never divided into a guessed split.
#
# The SECTION default is still MATERIAL ONLY, and it now applies to very few rows: as of
# 2026-08-20 almost every row declares its own material/labour split and so reports as
# installed regardless of what its section says. The sections where the default still governs
# are [hardware] (fasteners and connectors, whose install labour is inside the framing rate —
# pricing it again here would double-count), [footing_bedding] (delivered aggregate; spreading
# and compacting is in the excavator's number, which this file does not carry) and
# [install_parts]. [concrete] and [wall_structure] remain "installed" and MERGED, because
# ready-mix is not a material a homeowner takes delivery of and no source splits a placed-yard
# price into its two halves honestly.
#
# A row may now override its section:
#
#   "2x10" = { low = 2.8, high = 3.4, basis = "installed" }        # a real merged quote
#   "LVL"  = { material = { low = 7, high = 9 }, labour = { low = 3, high = 5 } }
#
# The second shape is the one to use when a quote arrives with the split spelled out. Until
# then, "installed" and merged is the honest record — that gap was plans/TODO.md's
# "prices.toml has no materials-vs-labour field", and it is closed.
#
# --- WASTE, CONTINGENCY, MARKUP, TAX ------------------------------------------------------
# All four are opt-in and all four are absent below, so the estimate is still net. When you
# add them, note that four sections ALREADY carry their waste in the quantity — framing,
# sheet_goods, floor_finishes and wood_surfaces are billed on an ORDER quantity — and a
# [waste] entry on one of those is a hard error naming the takeoff module that owns the
# factor. That double-count is the whole reason the table is validated rather than trusted.
#
#   [waste]
#   envelope_layers = 0.10
#   "envelope_layers:standing-seam" = 0.05     # per-key override
#   [contingency]
#   rate = 0.10
#   [markup]
#   overhead = 0.10
#   profit = 0.08
#   [tax]
#   material_rate = 0.06875                    # MN — applied to the MATERIAL portion only

[framing]
