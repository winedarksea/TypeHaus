# ==========================================================================================
# THE BID LADDER — turned on 2026-08-20 (owner decision), except markup
# ==========================================================================================
# Until today this file declared none of [waste] / [contingency] / [markup] / [tax], so the
# ladder was flat: `subtotal_net` == `total`. That was honest but it meant the printed number
# was a NET number wearing the word "total", and nobody comparing it to a builder's price
# could see why the two were 30% apart.
#
# The order is fixed and each stage prints on its own line — see takeoff/cost_model.py:
#     net -> waste -> ordered -> contingency -> markup -> tax -> total
# They are four different people's numbers (the takeoff's, the designer's, the builder's, the
# state's) and blending them into one factor makes all four unauditable.

[waste]
# The material you buy and do not install. ** IT NEVER RIDES ON LABOUR. ** You buy 110 SF of
# board to install 100 SF and throw 10 SF away; you do not pay the installer 10% more for it,
# because an installed labour rate is quoted per square foot of FINISHED area and already has
# normal cutting inside it. (takeoff/cost_model.apply_waste enforces this. It did not, until
# 2026-08-20: 41% of this house's waste — $10,531-19,796 — was being added to labour, which is
# what made waste and contingency look like the same stage charged twice. They are not: waste
# is a QUANTITY fact about material, contingency is an UNKNOWNS fact about scope.)
#
# The one admitted exception is a MERGED row: an installed price with no declared split cannot
# have its material half identified, so the factor rides on the whole number. [concrete] and
# [wall_structure] are the two. Waste over-applies slightly there, exactly where sales tax
# under-applies — declaring a split would fix both at once.
#
# Deliberately NOT declared on framing, sheet_goods,
# floor_finishes or wood_surfaces: those four are billed on an ORDER quantity that already
# carries their waste, and the loader makes a [waste] entry on one of them a hard error rather
# than a silent double-count (cli/price_file.WASTE_IN_QUANTITY).
#
# Nor is it declared on openings, placeables, sleeves, plumbing_specialties, install_parts or
# allowances. You do not over-order a window, a heat pump or an excavator; a wasted one is a
# mistake, not a rate, and that is what [contingency] is for. Omission here is a claim, not
# an oversight.
concrete             = 0.05   # short-load and over-order on ready-mix; you cannot buy 0.4 cy
wall_structure       = 0.05   # same, plus block breakage on RETAINING_BLOCK_12
footing_bedding      = 0.10   # aggregate compacts and is lost into the subgrade
envelope_layers      = 0.10   # board cuts, membrane laps, and the offcut at every opening
edge_trim            = 0.10   # trim is cut from stock lengths and the drop is not reusable
pipe_insulation      = 0.10   # split sleeve cut to fittings
construction_returns = 0.10   # short pieces cut from stock: sill, channel, blocking
floor_heat           = 0.05
hardware             = 0.03   # the box of connectors nobody counts back in
pipe_runs            = 0.05
ducts                = 0.05
conduit              = 0.05
railings             = 0.05
drainage             = 0.05

[contingency]
# 10% on the ordered subtotal. Design contingency, not a slush fund: this house is modelled to
# a level of detail most estimates never reach, and it is EXACTLY that detail which makes 10%
# the right number rather than the 15-20% a schematic-design estimate needs. What it covers is
# the scope this file provably cannot see at the line level — the fastener nobody counted, the
# detail that gets built twice, the subgrade that comes up wetter than the boring said.
# It does NOT cover the missing scope register in plans/cost-options.md; that is [allowances].
rate = 0.10

[markup]
# ** DELIBERATELY ZERO, and present so it is one edit to turn on. ** The owner's call
# 2026-08-20 was to leave the general contractor's overhead and profit out of the line-item
# total, on the reasoning that what this file adds up is a subcontractor sum, and a GC's fee is
# a contracting decision rather than a cost of the building.
#
# The two are separate stages because they compound in a fixed order: profit is taken on
# (ordered + contingency + overhead), not on the bare subtotal. Typical Twin Cities custom
# residential is overhead 0.08-0.12 and profit 0.05-0.10 — call it 15-20% combined. On this
# house that is roughly $100k-230k, which is why it is a decision and not a default.
# To turn on: set the two numbers. Nothing else in this file needs to change.
overhead = 0.0
profit   = 0.0

[tax]
# ** MATERIAL ONLY. ** In Minnesota a contract to improve real property is not itself taxable
# and construction LABOUR is exempt; the contractor is the end user of the materials and pays
# sales and use tax on them at purchase (MN DOR Sales Tax Fact Sheet 128, Contractors). That
# asymmetry is the entire reason [basis] exists, and the 2026-08-20 material/labour split pass
# is what makes this entry mean anything — before it, $88k-167k of the total was merged and
# unreachable by tax.
#
# ** SET TO SUBURBAN HENNEPIN, 8.525% ** (owner, 2026-08-20) — 6.875% state + 0.15% Hennepin
# County + 1.5% metro-area special district. To move the site, swap which line is commented;
# nothing else in this file depends on which one is active:
#
#     material_rate = 0.09025   # City of Minneapolis (the above +0.5% city sales tax)
#
# NOTE the asymmetry this leaves, deliberately and visibly: every LABOUR rate in this file was
# localised to MINNEAPOLIS wages, and those do NOT drop at the city line — suburban Hennepin is
# the same labour market. Only the tax is jurisdictional. If the site ever moves out of the
# metro entirely, both need revisiting, and the labour side is the larger of the two.
#
# `haus takeoff` still prints how much of the base tax could NOT reach, because it sits in
# merged installed rows ([concrete], [wall_structure], and the seamless-gutter row that says
# why). That figure is the honest measure of how much declaring more splits would be worth.
material_rate = 0.08525   # suburban Hennepin County  <- ACTIVE

[tax_included]
# ** WHICH MATERIAL PRICES ALREADY HAVE SALES TAX IN THEM. ** New 2026-08-20, and the reason
# it exists is a real double-count that was found by asking where each rate came from.
#
# THE CONVENTION FOR THIS FILE IS PRE-TAX. Every price should be a number you could read off a
# shelf, a yard's quote sheet or a manufacturer's list — tax excluded, and added once by the
# [tax] stage above. That is what a shelf price IS, so most rows need nothing here.
#
# The exception is any material rate BACK-DERIVED FROM A PUBLISHED INSTALLED COST. A HomeGuide
# or Angi "installed" figure is a contractor's price to a homeowner, and in a materials-taxing
# state the contractor has already paid the tax and passed it through inside that number. Take
# a material share out of it and the share carries the tax with it. Taxing it again is pure
# double-count — about $4,000-11,000 on this house before these entries.
#
# Two things to know when adding a row here:
#  1. It is a BOOLEAN. "Does this number already have tax in it" is a question with an answer;
#     "what effective rate is buried in this national average" is not, and the loader refuses a
#     float so nobody is tempted to invent one. What is skipped is reported by `haus takeoff`
#     rather than absorbed, exactly like the merged figure beside it.
#  2. IT IS THE SECOND-BEST ANSWER. The best one is to re-source the rate from a pre-tax list
#     price, which deletes the entry. `openings` is the live example — it is flagged below and
#     is being re-sourced from manufacturer list prices; when that lands, its line comes out.
#
# NOT FLAGGED, and each for a checked reason: [framing] and [footing_bedding] are yard and
# MnDOT bid prices; [placeables] is retail device/appliance listings; [sheet_goods] and most of
# [envelope_layers] are per-sheet and per-SF shelf prices; [hardware] is Simpson list.
# [concrete] and [wall_structure] are the likeliest tax-inclusive rates in the whole file and
# need no entry — they are MERGED, and the tax stage already cannot reach a merged row.

# (openings was flagged here on 2026-08-20a and the flag is GONE as of 2026-08-20b: the
# section was re-sourced from pre-tax shelf and manufacturer list prices, which is the better
# fix the note here always said it was. Do not put it back without re-reading that header.)

# HomeGuide / Angi 2026 flooring cost charts, which are installed prices.
floor_finishes = true

# Only the six SPLIT allowance rows have a material bucket at all (the rest are merged and
# unreachable by tax anyway), and all six had their material share taken out of an installed
# industry figure: excavation, the driveway, the PV array at $/W installed, branch-circuit
# conductors, interior trim and paint.
allowances = true

[basis]
framing              = "material"
sheet_goods          = "material"
hardware             = "material"
concrete             = "installed"
floor_heat           = "material"
placeables           = "material"
floor_finishes       = "material"
