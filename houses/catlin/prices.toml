# RESEARCHED 2026-08-07 — [low, high] $/cy PLACED (ready-mix delivered + placement
# labour), by solid category. Basis: 3000 psi ready-mix $125-175/cy delivered nationally,
# ~$115/cy in the Minneapolis market; labour is 45-55% of installed concrete cost. Formed
# small-volume pours (beams, columns, the thermal break) carry a much higher $/cy than a
# slab because the forms, not the mud, are the cost. Sources: concretenetwork.com 2026
# concrete prices, angi.com Minneapolis concrete slab cost, constructem.com 2026 yard cost.
#
