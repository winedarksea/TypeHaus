# prices.toml — unit prices for the catlin house.
#
# Type:Haus ships NO default prices: material cost is local, seasonal, and negotiated.
# Every row below is keyed from the house's own bill of materials (`haus takeoff` /
# cli/prices.py ESTIMATE_PLANS). A row carries either a real number (`KEY = 1.23`) or a
# quote range (`KEY = { low = 1.0, high = 1.5 }`); rows left COMMENTED stay honestly
# UNPRICED in the estimate and are never priced at zero.
#
# Cost tracking (paid check-offs, exact products, actual $) lives in costs.toml, keyed by
# the same (section, key) join used here.
#
# EVERY NUMBER IN THIS FILE IS A RESEARCHED ESTIMATE FOR BUDGETING, not a quote. Three
# research passes so far: 2026-08-07 (framing, sheet goods, concrete, envelope layers,
# openings), 2026-08-08a (everything else) and 2026-08-08b (owner answers: stair species,
# railings, drainage, the Gree line, the furnishings split). Each section header carries
# its own basis and sources.
#
# --- MATERIALS OR INSTALLED? -------------------------------------------------------------
# This used to be four paragraphs of prose that no consumer could read. It is now the
# [basis] and [basis_notes] tables at the bottom of this file, and the estimate reports
# three subtotals off them: material, labour, and merged (an installed row whose split is
# not known). A merged number is never divided into a guessed split.
#
# The default is MATERIAL ONLY: delivered stock, no labour, no waste factor beyond what the
# takeoff's own order quantity already carries. [concrete] and [wall_structure] are
# "installed", because ready-mix is not a material a homeowner takes delivery of.
#
# A row may now override its section:
#
#   "2x10" = { low = 2.8, high = 3.4, basis = "installed" }        # a real merged quote
#   "LVL"  = { material = { low = 7, high = 9 }, labour = { low = 3, high = 5 } }
#
# The second shape is the one to use when a quote arrives with the split spelled out. Until
# then, "installed" and merged is the honest record — that gap was plans/TODO.md's
# "prices.toml has no materials-vs-labour field", and it is closed.
#
# --- WASTE, CONTINGENCY, MARKUP, TAX ------------------------------------------------------
# All four are opt-in and all four are absent below, so the estimate is still net. When you
# add them, note that four sections ALREADY carry their waste in the quantity — framing,
# sheet_goods, floor_finishes and wood_surfaces are billed on an ORDER quantity — and a
# [waste] entry on one of those is a hard error naming the takeoff module that owns the
# factor. That double-count is the whole reason the table is validated rather than trusted.
#
#   [waste]
#   envelope_layers = 0.10
#   "envelope_layers:standing-seam" = 0.05     # per-key override
#   [contingency]
#   rate = 0.10
#   [markup]
#   overhead = 0.10
#   profit = 0.08
#   [tax]
#   material_rate = 0.06875                    # MN — applied to the MATERIAL portion only

[framing]
# RESEARCHED 2026-08-07 — [low, high] $/LF of ordered stock, material only, no waste
# factor and no labour. Basis: SPF framing at $465-490/MBF wholesale plus the 14.54%
# softwood tariff on Canadian mill stock; retail 2x4 studs at $5-8 per 8' piece, 2x6 at
# 50-60% over 2x4; LVL at $3-5/LF per 1.75" ply; I-joist and LSL rim from the same
# builder-guide surveys. Midwest is at the low end of every published national range, so
# these lean low-of-national. Sources: buildermuse.com lumber-price guide 2026,
# buildestimatory.com lumber guide, homematerialcalc.com 2026 price guide,
# wellbuiltflorida.com / designtransitionstudio.com LVL cost-per-foot guides.
#
# 2026-08-08 addendum — the `* panel` and `deck *` profiles. The 2026-08-07 pass left
# these blank on the guess that they were glazing extrusions and composite board. Reading
# `framing_by_size[].types` says otherwise: they are the roof-edge, gutter, membrane and
# stair members. So they split two ways.
#
#   Priced below, because nothing else bills them: the two `gutter` profiles, the
#   `membrane` strip, the 3/8" `furring` batten, the 1.5x1.5 `sheathing` blocking, the 2x2
#   `insulation` strip, and the five stair members (treads, landing decks, hanger, winder).
#
#   Left blank ON PURPOSE, because [edge_trim] already bills the same members by the foot
#   and pricing both would double-count: the three `corner_trim` profiles, both `fascia`
#   profiles, the `ridge_cap` and the `soffit` profile. Their edge_trim rows carry
#   `also_in_framing: true`, which is the flag that says so.
#
#   `0.5x0.5 panel` was left blank last pass as unresolvable; 2026-08-08b resolves it.
#   The row is 498 LF ordered / 462.9 LF cut and mixes three types. 243.9 LF of that cut is
#   `cladding` — the roof-edge closure band, which is roof standing-seam metal (resolve/
#   roof_trim.py `_edge_cladding_members`, material `standing-seam`) and is already billed
#   by the foot as [edge_trim] `edge_cladding`. The other 219.0 LF is `furring` and
#   `sheathing`, which the owner confirms are 1/2" plywood ripped from the same 4x8 sheet
#   as the sheathing. So the row is priced at the plywood-rip rate x the non-cladding
#   share, which bills the plywood and does not re-bill the metal:
#     1/2" x 1/2" rips from a 4x8 sheet: 48" / (0.5" + 1/8" kerf) = 76 strips x 8' = 614
#     LF per sheet. At the [sheet_goods] `struct-1-plywood` rate of $28-52/sheet that is
#     $0.046-0.085/LF of rip. The plywood share of the ORDER is 498 x (219.0/462.9) = 236
#     LF, so the blended rate over all 498 LF is 236/498 x $0.046-0.085 = $0.022-0.040.
#   It is a $11-20 line. It is priced anyway because "too small to matter" is how a BOM
#   quietly stops reconciling.
#
#   `0.375x0.375 panel` (108 LF, `furring`) is the same plywood rip and was repriced with
#   it — the 2026-08-07 number treated it as milled SPF batten at 10x the real cost. The
#   1.5x1.5 `sheathing` blocking is NOT a rip (nothing 1.5" thick comes off a 1/2" sheet)
#   and keeps its 2x2 solid-stock rate.
# $/LF of ordered stock, by lumber profile
"0.02x0.02 panel" = { low = 0.35, high = 1 }  # 76 LF — membrane/flashing strip
"0.375x0.375 panel" = { low = 0.05, high = 0.1 }  # 108 LF — 3/8" furring, plywood rip
