# table reads sticks the resolver emits from walls, floors and roofs; a Beam is authored, not
# emitted, so it never reaches it. RB-HOUSE is the one exception — the ridge resolves as a
# framing member and shows up as 36 LF of lumber — and it is not one of these.
#
# A cubic yard is a strange unit for lumber and the file admits it: `structural_solids`
# measures volume, so the yard is what the join has. Every rate below is therefore built from
# a LINEAL FOOT figure taken off this file's own [framing] rows, then divided by the modelled
# volume, and both numbers are in the trailing comment so an estimator can check the
# conversion instead of trusting it. 1 cy of framing is 27 cf.
