[ducts]
# RESEARCHED 2026-08-08 — [low, high] $/LF, material only. Sheet metal is $7-13/LF for
# materials against $35-60/LF installed, so this is the material third of a published
# installed price. Supply and return are the heat-pump trunk and branches in rigid metal;
# `exhaust` is the smaller round ERV/vent runs, which are cheaper by the foot. Sources:
# homeguide.com 2026 cost to replace ductwork, angi.com ductwork installation, angi.com flex
# vs rigid duct comparison.
# $/LF, by system
#
# ** UN-BLENDED 2026-08-27. ** The 2026-08-25 ERV pass replaced nine rectangular sheet-metal
# trunks with 75 mm semi-rigid radials, and until today `[ducts]` keyed on `system` alone, so
# one `supply` rate covered a 6" insulated riser, a 3" semi-rigid radial and a 14x8 galvanized
# trunk together. `ducts` now takes the qualified-key treatment `[drainage]` and
# `[wall_structure]` already have (cli/prices.QUALIFIED_KEY_FIELD, qualifier `material`), so a
# `"supply:semi_rigid"` row prices the radial and a bare `"supply"` row prices the sheet metal.
#
# ** A ROW WHOSE MATERIAL THE MODEL NEVER NAMED PRICES ON THE BARE KEY. ** The four sheet-metal
# supply segments and the one return stub carry an empty `material`, which is falsy, so they
# fall through to the bare rows below — and those bare rows are therefore RE-BASED to sheet
# metal alone rather than left at the old blend.
#
# Semi-rigid is about half the material of sheet metal and installs in a fraction of the time;
# that speed is the whole labour argument for a radial system, and it is why the section total
# falls when the blend is taken out. It was over-priced, not the radial under-priced.
# ** DIAMETER UN-BLENDED 2026-08-30, WHICH IS WHAT THE 08-27 NOTE SAID WAS STILL LEFT. **
# `QUALIFIED_KEY_FIELD["ducts"]` is now the TUPLE `("material", "diameter_in")`, and a
# lookup walks progressively less specific keys — `supply:semi_rigid:3.0` ->
# `supply:semi_rigid` -> `supply` — so the bare and material-qualified rows below still mean
# exactly what they meant, and the two `:3.0`/`:6.0` rows are an opt-in on top of them.
#
# The split is rate-neutral on today's mix, deliberately: 3" at 2.25/4.50 and 6" at 4.00/8.00
# re-weight to the 2.50/5.00 and 2.75/5.50 blends they replace at the current 83/17 and 72/28
# splits. Nothing about this commit moves the section total; what it does is stop the total
# from being silently wrong the next time a run changes size. 75 mm semi-rigid is roughly
# half the cost per foot of 6" and pulls in a fraction of the time — a 3" branch is one
# person feeding it through a joist bay.
#
