# 2026-08-08 addendum — the `* panel` and `deck *` profiles. The 2026-08-07 pass left
# these blank on the guess that they were glazing extrusions and composite board. Reading
# `framing_by_size[].types` says otherwise: they are the roof-edge, gutter, membrane and
# stair members. So they split two ways.
#
#   Priced below, because nothing else bills them: the two `gutter` profiles, the
#   `membrane` strip, the 3/8" `furring` batten, the 1.5x1.5 `sheathing` blocking, the 2x2
#   `insulation` strip, and the five stair members (treads, landing decks, hanger, winder).
#
#   Left blank ON PURPOSE, because [edge_trim] already bills the same members by the foot
#   and pricing both would double-count: the three `corner_trim` profiles, both `fascia`
#   profiles, the `ridge_cap` and the `soffit` profile. Their edge_trim rows carry
#   `also_in_framing: true`, which is the flag that says so.
#
#   `0.5x0.5 panel` was left blank last pass as unresolvable; 2026-08-08b resolves it.
#   The row is 498 LF ordered / 462.9 LF cut and mixes three types. 243.9 LF of that cut is
#   `cladding` — the roof-edge closure band, which is roof standing-seam metal (resolve/
#   roof_trim.py `_edge_cladding_members`, material `standing-seam`) and is already billed
#   by the foot as [edge_trim] `edge_cladding`. The other 219.0 LF is `furring` and
#   `sheathing`, which the owner confirms are 1/2" plywood ripped from the same 4x8 sheet
#   as the sheathing. So the row is priced at the plywood-rip rate x the non-cladding
#   share, which bills the plywood and does not re-bill the metal:
#     1/2" x 1/2" rips from a 4x8 sheet: 48" / (0.5" + 1/8" kerf) = 76 strips x 8' = 614
#     LF per sheet. At the [sheet_goods] `struct-1-plywood` rate of $28-52/sheet that is
#     $0.046-0.085/LF of rip. The plywood share of the ORDER is 498 x (219.0/462.9) = 236
#     LF, so the blended rate over all 498 LF is 236/498 x $0.046-0.085 = $0.022-0.040.
#   It is a $11-20 line. It is priced anyway because "too small to matter" is how a BOM
#   quietly stops reconciling.
#
#   `0.375x0.375 panel` (108 LF, `furring`) is the same plywood rip and was repriced with
#   it — the 2026-08-07 number treated it as milled SPF batten at 10x the real cost. The
#   1.5x1.5 `sheathing` blocking is NOT a rip (nothing 1.5" thick comes off a 1/2" sheet)
#   and keeps its 2x2 solid-stock rate.
