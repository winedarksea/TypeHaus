# QUANTITY, 2026-08-30: 89.82 cy across three rows (0.10 + 82.73 + 6.99), not the 97.07
# this line carried. The 97.07 was already stale before the sunken-garden court work — that
# work ADDED 12.5 cy (the three retaining footings went 7'-0" -> 8'-0" and W-SG-ARCH's own
# bed is new), so the pre-existing figure was overstated by ~20 cy. **The full-truckload
# argument above still holds at 90 cy / 126 tons**; it would stop holding somewhere under
# ~40 cy, which nothing here approaches.
