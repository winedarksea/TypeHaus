[member_protection]
# RESEARCHED 2026-08-27 — [low, high] $/LF of MEMBER covered, by material tag. New section,
# and new BOM table behind it (takeoff/member_protection.py): self-adhered butyl over the
# framing tops of the two sunken-garden decks and all eleven of their beams and girts.
#
# ** NOTHING PRICED THIS BEFORE, BECAUSE NOTHING COULD MEASURE IT. ** [framing] counts sticks
# by (profile, category) across the whole house, so "the two garden decks' joists" is not a
# row you can address; [timber] bills the standalone beams by the cubic yard. Neither can
# answer "how many feet of tape", and the membrane that keeps water out of a built-up beam's
# ply seams was carried nowhere at all — not as a quantity, not as a dollar, not as a note.
#
# TWO TAGS, NOT ONE, AND THE WIDTH IS WHY. The BOM carries each row's member width, taken off
# the member's own cross-section, and the widths are 1.25"/1.5" (joists, rims, blocking, the
# four single-ply girts) against 4.5" (the seven 3-ply 2x12 beams). Those are different rolls
# at a 2-3x difference per foot, and buying the narrow roll for a 3-ply beam leaves both ply
# seams — the whole point of the exercise — uncovered. A beam that gains a ply re-reads its
# width from `cross_section` and the order follows; that is the trap this split closes.
#
# Basis: Trex Protect butyl 1-5/8" x 50' at $23.88/roll = $0.48/LF and the 3-1/8" beam roll
