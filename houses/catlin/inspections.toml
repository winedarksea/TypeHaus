# inspections.toml — what the AHJ said, beside what the code requires.
# Written by Type:Haus and safe to edit by hand. See docs/site-state-format.md.
# Dates are prose: nothing here is computed.
#
# The engine ships no phone numbers — these are the house's, like prices.toml. Confirm each
# one before the first call: they move, and a wrong number on a 7:30am deadline is the one
# error this file exists to prevent.
#
# Saint Paul does its OWN electrical, plumbing and mechanical inspections. Minn. Stat.
# 326B.36 subd. 1 and 6 let a municipality run them, and DSI does — on three different
# numbers, all in the same 7:30-9:00 window, or through the PAULIE portal. The earlier
# "state inspector" electrical row here was wrong, and it would have sent the first call of
# the rough-in to an office that does not take it.
#
# `lead_days`, the exact appointment window and the reinspection fee are NOT published.
# Minn. R. 1300.0210 subp. 4 obliges the authority to state them at permit issuance: they
# are open items, and the board says so until they are filled in.
#
# The `[[extra]]` holds are NOT AHJ inspections: no Minnesota rule requires either, and the
# profile is right not to list them. `authority = "owner"` throughout — a hold the owner
# placed on themselves is not an AHJ visit, and giving it a phone number would be a lie.
#
#   * `girt_screws` is here because the exterior foam is this house's weather plane (there
#     is no WRB), the girts are screwed through it, and once the foam is on nobody can see a
#     missed screw again.
#   * `truss_mep_review` is BLD-05's actual recommendation, made mechanical. Three trades
#     thread FS-S-WEST's 8 7/8" web window and none of them sees the others' drawings; JLC
#     on open-web floor trusses is blunt about the remedy — "it is beneficial to have
#     plumbing layouts designed in advance and reviewed by the plumber BEFORE trusses are
#     fabricated" — and a truss blank is the one thing on this job that cannot be corrected
#     after the fact. It is an `[[extra]]` rather than an authored hold on the visit because
#     only `[[extra]]` carries `attempts`, and the first set of shop drawings is usually not
#     the last.

[permit]
# Filled in at issuance. The code edition is a FIELD and not a constant: the 2024-IRC-based
# Minnesota code has no adopted effective date yet, so a 2027 permit is most likely still the
# 2020 cycle — and Saint Paul's 2026 NEC applies to electrical permits pulled after
# 2026-08-17, which is a different date on a different line.
code_edition = "mn-2020"
nec_edition = "2026"
note = "number, issued and expires are filled in at issuance — not before"

