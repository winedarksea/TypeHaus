[[extra]]
# ** THIS ONE HAS NO `gates`, DELIBERATELY, AND `girt_screws` ABOVE IS WHY. **
#
# A gate names a TRADE and a trade is not schedulable. `girt_screws`'s own `gates` is
# dropped as circular today (`haus site validate` prints it) and it bites solely through the
# authored `depends_on` in tasks.toml. Worse here: implied gates never reach a standalone
# visit at all — `schedule/visits.py` calls `implied_gates()` only in the implicit-package
# branch — so a gate could never attach to `site/long-lead-orders`, which is the one visit
# this hold exists to stand in front of. And a gate on "framing" would also catch
# `task/framing/basement`, a stairwell partition that owes the fabricator nothing.
#
# The two authored `depends_on` edges in tasks.toml are the mechanism that works.
#
# ** DO NOT GIVE THIS A `requires`. ** It is a sink — no `after`, no `requires` — and that
# is what keeps it out of a cycle: gates run visit -> inspection only, so nothing can come
# back around. `requires` is the one field that could deadlock it, the way `gates` stapling
# a later inspection onto an earlier trade's implicit visit deadlocked foundation_backfill.
#
# `check_ids` names `mep.run_member_crossing` because that check IS this review, done by the
# engine: it grades every pipe, duct and raceway against the window its floor's section
# gives it. An id here that is not registered would be worse than an error — `fold_results`
# of nothing is UNKNOWN, the record sits at `not_ready` for ever, and nothing prints why.
id = "truss_mep_review"
label = "MEP layout reviewed against the floor-truss webs, before the trusses are fabricated"
authority = "owner"
check_ids = ["mep.run_member_crossing"]
on_site = [
  "FS-S-WEST layout issued to the truss fabricator, with the MEP overlay on it",
  "plumber has reviewed the drain layout against the 8 7/8\" web window and signed it",
  "chases designed INTO the webs where a run cannot hold the window",
  "electrician and HVAC have marked their crossings on the same sheet",
]
milestone = "preconstruction"

[[extra]]
# ** THE THERMAL-BREAK BLOCKOUTS (2026-09-22, basis 7; free body §11j). ** The five boards
# pass only because none of them is a form face: each court face is cast on a stripped
# blockout and the board set into the slot. That is a field sequence the model states and
# cannot enforce, so the owner walks the empty slots. No `gates` and no `requires`, for the
# reasons `truss_mep_review` gives; it binds through `task/concrete/building/slabs`'
# `depends_on` (the rim slab closes over the footing slots) and is printed on the walls
# visit's `boards` checkpoint.
id = "break_blockouts_stripped"
label = "Thermal-break slots stripped clean and the boards set, before the rim slab"
authority = "owner"
check_ids = ["structural.thermal_break"]
on_site = [
  "all five blockouts pulled: TB-SG-W1/E1, TB-SG-W1/E1-STEM and W-SG-BRKBM's",
  "every slot clean to the house face — no fins, no grout, no form oil pooled",
  "each board cut to its slot and set, full height and full length, none cast against",
  "understood: ONE board cast against a pour undoes the cap: the beam board alone takes the house thrust from 28,807 to 69,969 lb and the slab edge to 1.29 of its sustained-load limit, and one stem board puts its floor line at 1.51 (free body 11l). Nothing downstream would notice",
  "the footing and stem boards lapped at the court floor plane (trap 1)",
]
milestone = "foundation"

[[extra]]
id = "girt_screws"
label = "Girt screws verified on every wall, before any foam goes on"
authority = "owner"
after = ["framing"]
gates = ["insulation"]
check_ids = ["structural.girt_course_spacing"]
on_site = ["every girt block three-ply and fastened", "one 8\" screw per block, counted wall by wall", "course phase checked against the window heads"]
milestone = "weathertight"
