<g font-family="sans-serif" font-size="14" fill="#293d46"><text x="548" y="372">Pump / timer A</text><text x="548" y="427">Pump / timer B</text><text x="780" y="310">12 × 0.5 GPH</text><text x="820" y="382">12 × 0.5 GPH</text><text x="545" y="504">Wired low water + floor detector</text><text x="545" y="523">Manual ARM; no automatic restart</text><text x="530" y="566">210 seconds / zone / day initially</text><text x="530" y="588">All emitter outlets ABOVE tank water level.</text><text x="530" y="610">Measure delivery and prove ten-day closed-tap trial.</text></g>
