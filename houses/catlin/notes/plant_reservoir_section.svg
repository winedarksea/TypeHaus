<g font-family="sans-serif" font-size="14" fill="#293d46"><text x="35" y="122">Stop → electric fill valve → throttle → mechanical float</text><text x="35" y="174">Domestic inlet: approximate 19.63″</text><text x="390" y="224">Discharge lowest opening: 19.13″</text><text x="390" y="250">2″ free air to actual rim</text><text x="390" y="285">Flood rim: design 17.13″*</text><text x="112" y="356">9 gal normal fill*</text><text x="112" y="382">7 gal watering allowance</text><text x="112" y="404">+ 1 gal operating reserve</text><text x="128" y="493">1 gal unusable*</text><text x="85" y="554">*Water heights illustrative: calibrate gallon marks.</text><text x="85" y="578">Adjust bracket to delivered rim; no submerged fill outlet.</text></g>
<g stroke="#58656d" stroke-width="2" fill="#eee"><rect x="530" y="345" width="125" height="45" rx="5"/><rect x="530" y="400" width="125" height="45" rx="5"/><rect x="530" y="484" width="265" height="48" rx="5"/></g>
