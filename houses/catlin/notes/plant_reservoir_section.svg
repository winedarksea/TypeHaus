<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">Plant reservoir section and two-zone irrigation</title>
<desc id="desc">Schematic section distinguishes supply inlet, downward discharge, air gap and tank flood rim. Two pumps each water twelve pots. Water heights are illustrative; measured gallon marks govern.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176c8d"/></marker></defs>
<rect width="1000" height="640" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#293d46"><text x="35" y="40" font-size="23">Plant-room reservoir — section / control intent</text><text x="35" y="66" font-size="14">Schematic, inches AFF • 2026-11-10 • not a bracket fabrication drawing</text></g>
<g stroke="#58656d" stroke-width="3" fill="none"><path d="M90 282L115 520H355L380 282"/><path d="M90 282H315M347 282H380"/><path d="M345 310V195H310"/><path d="M240 250V210H310"/><path d="M240 210V228"/><path d="M300 210L280 318H250"/><rect x="230" y="312" width="42" height="18" fill="#eee"/></g>
<path d="M98 326H372L351 514H119Z" fill="#c7e5ec" opacity=".8"/>
