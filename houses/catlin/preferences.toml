[project]
# Whose code this house is checked against (checks/code/mn_residential/profile.py).
jurisdiction = "mn-2020"

[envelope]
window_u = 0.25
ach50 = 1.0
# LBL height correction. Two storeys over the leakage plane: `main` and `second`. The
# basement is below it and the attic pocket is inside the roof, neither of which is a
# storey in the LBL sense — which is why this is authored rather than counted off the
# storey list. Shielding is read off `Site.wind_exposure` ("B" = suburban/wooded =
# well-shielded), so N derives to 18.5 x 0.8 x 1.2 = 17.8, not the old flat 18.0.
infiltration_storeys = 2
interior_setpoint_f = 70
interior_relative_humidity = 0.35
exterior_relative_humidity = 0.80
south_wwr_threshold = 0.40
adequate_overhang_ft = 0.0

[framing]
module_in = 16
corner = "4-stud"
# THE RO LADDER. These three numbers are one rule seen at three rungs, and the rule is
# arithmetic on the 16" module and a 1.5" stud, not code: how wide can a rough opening get
# before it costs one more stud line? Every rung assumes the RO is centred where it is
# cheapest — a bay centre for the first, a stud line for the other two.
#
#   14"  NO stud broken. One bay is 16" - 1.5" = 14.5" clear. No header, no jacks, no
#        kings: the bay's own two studs carry the rough sill and head nailer.
max_window_ro_unbroken_in = 14
#
#   30"  ONE stud broken, NO jacks. Kill the stud in the middle and the two that flank it
#        leave 32" - 1.5" = 30.5" clear. Nothing eats into that on a NONBEARING wall,
#        because IRC R602.7.4 lets a nonbearing header be a single flat 2x4 nailed to the
#        stud each side — there is no jack under it to lose width to.
#        Was 42 until 2026-08-25, which was the two-broken-stud rung (48" - 1.5" - 3" of
#        jacks) and a leftover from the retired 42" WT-4248. No window in the house was
#        over 30" when it came down, so tightening it changed no result — it just stopped
#        the file from permitting a size the house had already decided against.
max_window_ro_nonbearing_in = 30
#
#   27"  ONE stud broken, WITH jacks. A BEARING header lands on a jack at each end
#        (R602.7.5), and each jack packs against its king, so the same 30.5" of clear bay
#        loses 2 x 1.5" = 27.5". THE 3" BETWEEN THIS RUNG AND THE ONE ABOVE IS THE PAIR OF
#        JACKS — that is the whole rule, and it is why the cap is a function of bearing
#        status and nothing else.
#        Went 27 -> 30 on 2026-08-01 to let WIN-S-BED1/BED2 reach R303.1's 8% glazing, and
#        came BACK to 27 on 2026-08-25 when that turned out to be avoidable: R303.1 binds
#        on area, and area can be bought in height. The two bedrooms are 27x54 (WT-2754)
#        now and clear R303.1 by wider margins than the 30x48 did. See the long note at
#        WIN-S-BED1 in plan/storeys/second.py.
#
# R602.7.5 does permit "approved framing anchors" in place of a jack, so a header hanger
# would buy back the 3" and let a 30" RO sit in a bearing wall on one broken stud. That is
# a real option, not a fiction — it is declined here because it is per-opening hardware and
# a detail the framer has to be told about, which is exactly the cost this preference exists
# to avoid. If a future opening needs it, raise this number deliberately and say so.
max_window_ro_bearing_in = 27

[structural]
# The dead load a guard may put on ordinary wood framing (structural.masonry_guard_bearing).
# A guard's own weight is derived from its assembly's layers and their material densities, so
# this is the only authored number in that rule: roughly a heavy wood guard with 6x6 posts,
# which is what a deck rim designed to R507's 40 psf live + 10 psf dead was drawn expecting.
# The porch's grouted-CMU-and-white-brick parapet is ~420 plf against it — which is the point:
# it lands on the concrete sunken-garden walls, and it could not land on a wood deck.
max_guard_dead_load_on_wood_plf = 50

# The same allowance for a MASONRY WALL PASSING THROUGH A FLOOR DECK
# (structural.through_deck_clearance). A sibling of the key above, not a stretch of it: the
# number is the same and the rule is not, and raising one for a heavy parapet must not
# license a brick pier bearing on plywood. The three W-M-FIRE-STUB-* piers stand on W-B-E1's
# pour, so they report hard bearing and never reach this figure; what it is really here for
# is the day somebody "simplifies" the detail by starting the wythe on the subfloor, which
# arrives at ~236 plf against it (notes/east_breast_bearing.md §3). That used to be a ⚠ box
# a reader had to obey; it is a check now.
max_masonry_dead_load_on_wood_plf = 50

# The air a subfloor sheet must leave round a wall passing through it, inches. Catlin governs
# at 5/8" — joists 006 and 008 either side of the fireplace piers — which is residue of a
# 44 1/4" panel laid out on a 16" joist module, not a margin anybody chose. 1/2" is a mason's
# clearance and the saw cut itself is 1/2" (resolve/through_deck._SHEET_CLEARANCE_M, a
# derivation constant, never this). If a future widening FAILs here, that is information
# about the widening, not a number to raise.
min_through_deck_clearance_in = 0.5

# ** THE NORTH ENTRY CANOPY'S DESIGN SNOW, AND IT IS A DRIFT CASE, NOT THE GROUND LOAD. **
# The house's north face is a gable end standing 6 1/2" south of the passage roof and rising
# 12 to 21 feet above it. That is an ASCE 7 §7.7 roof-step drift and it governs. Worked by
# hand at the site's authored ground_snow_load_psf = 50 (notes/north_entry_piers.md §3):
#
#   snow density   gamma = 0.13(50) + 14                        = 20.5 pcf
#   balanced, Ct 1.2 (unheated open canopy), Ce = Is = 1.0      = 42 psf
#   leeward drift  hd    = 0.43 * 36^(1/3) * 60^(1/4) - 1.5     = 2.45 ft
#   drift surcharge pd   = hd * gamma                           = 50.3 psf at the house wall
#   drift width     w    = 4 * hd                               = 9.8 ft
#   average surcharge across the canopy's own 6'-0" of that triangle
#                        = (47.1 + 16.3) / 2                    = 31.7 psf
#   design snow          = 42 + 31.7                            = 73.7 psf
#
# ** THE DRIFT IS 9.8 FT LONG AND THE PASSAGE IS 6 FT. ** The triangle runs another 3.8 ft
# into the garage roof, so the garage's two southernmost trusses are drift trusses too. Spec
# them to the fabricator as p_g = 50 psf WITH the surcharge from the adjacent house wall named
# explicitly; a quote against "50 psf ground snow" prices ordinary trusses.
#
# The engine computes NO part of this -- the only p_f in the codebase is a 0.7 * p_g in a
# drawing emitter -- which is why it is authored here rather than derived.
roof_beam_snow_psf = 73.7
roof_beam_dead_psf = 10.0

[plumbing]
drain_stack_required_structure_in = 5.5
# **The visible-copper rule retired on 2026-08-21, and it retired the way it was built to.**
#
# It read: supply pipe you can see is lacquered copper, everywhere else PEX. "Where you can
# see it" was never a list of run tags — `mep.pipe_material_preference` asks what is
# *directly above* each basement supply segment, because a cast concrete deck means the pipe
# hangs in the open and reads as part of the room, while a framed floor means it will be
# covered. The note here said so in as many words: "Change SL-M-DECK to wood joists and
# everything under it stops being visible pipe with nothing here to edit."
#
# That is what happened. Two thirds of the basement ceiling is I-joists now, and the owner's
# call on the other third was gypsum over the EPS anyway — IRC R316.4 wants a thermal barrier
# there, and stopping the board at the boundary to expose 414 SF of soffit was not worth it.
# With drywall on the whole ceiling there is no visible pipe left to have a rule about, so
# both keys are deleted rather than restated, and basement supply reverts to the default
# (PEX, unfinished). Deleting them is the edit; the rule needed no other change.
#
# visible_basement_material = "copper"
# visible_basement_finish = "lacquered"

[mep]
# ** ZERO, AND THE REASON IS THE BASEMENT HEAD BUDGET, NOT INDIFFERENCE. **
#
# `mep.drain_slope_margin` asks a drain to hold some grade IN HAND over the code minimum,
# because a rigid standoff is stepped about an inch every four feet and the plumber's
# tolerance runs one way — toward more pitch. The engine's default is 1/16"/ft. Twelve
# catlin runs are under it and the tightest, PR-B-BATH-DRAIN, is at EXACTLY 1/4"/ft with
# nothing in hand at all.
#
# It cannot be bought. SP-B-SEWER-EXIT's invert is CAST. PR-B-MAIN-DRAIN holds 0.267"/ft
# to reach it — 0.017"/ft over the minimum itself — and PR-B-BATH-DRAIN arrives 0.190"
# over its centreline. Steepening the branch 0.05"/ft costs 0.43" over 8.64 ft and puts it
# UNDER the main: an advisory traded for a real `mep.drain_tie_in` FAIL. The basement head
# budget is genuinely spent, and the honest record of that is this number plus this
# paragraph, not a suppression that says nothing.
#
# **Every PASS still prints its margin**, which is what keeps the twelve thin runs visible
# without gating on them — and printing the margin is what BLD-05 was reaching for and
# could not get. Raise this toward the engine's 0.0625 the day the exit invert or the
# basement ceiling moves. The engine default is deliberately left alone so a NEW house gets
# the useful rule, and so houses/starter carries it unsuppressed.
min_drain_slope_margin_in_per_ft = 0.0

[mep.routing]
# **The router's weights, and they are preferences rather than code.** Everything here is
# stated in INCHES OF EQUIVALENT TRAVEL, the one unit `typehaus/routing/cost.py` prices in,
# so a route's cost is comparable to its own length and `haus route --explain` reads as
# "42 ft of pipe, 3 bends, 6 ft of it through the study".
#
# These are the engine's own defaults written out rather than changed. That is the point of
# authoring the table at all: `cost_from_preferences` existed and nothing called it, so
# every route in this repo was priced at numbers no house had ever been shown. Writing them
# here makes them arguable — change one and `--explain` prints what changed.

# What one change of axis costs. Two feet is roughly what a plumber's fitting, its labour
# and its head loss are worth against straight pipe on this house: high enough that the
# search prefers one L to a staircase, low enough that it will still turn twice to get out
# of a bedroom.
bend_in = 24.0

# A foot of VERTICAL travel against a foot of horizontal. Under 1.0 because a drop is cheap
# pipe in a wall or a bay; not free, because it still has to land somewhere reachable.
riser_per_ft = 0.5

# Per-foot discount for riding a joist bay, a soffit with section left, or a wall cavity.
# **Capped at the travel term** and never allowed below zero — an edge cheaper than its own
# Manhattan length would break the A* heuristic's admissibility and the router would stop
# being optimal without saying so. At 8 the cheapest possible inch is 1/3 of an inch, which
# is what `--explain` prints as the heuristic's scale.
corridor_discount_per_ft = 8.0

# Per-foot penalty for travelling IN a wall beyond one stud bay, because every stud on the
# way gets bored. Mirrors `mep_queries._STUD_BAY_TRAVEL_M`'s reading in
# `mep.wet_wall_occupancy`, which reports the same thing after the fact.
in_wall_travel_per_ft = 18.0

# **The equal-friction design rate a duct is sized at**, in. w.g. per 100 ft — the
# ASHRAE/ACCA Manual D method, and its residential default. Not a router weight: it decides
# a SIZE, not a lane, and it is here because it is the same kind of thing as the weights
# above — a house's own preference, arguable, and printed by `haus route --explain` so a
# size nobody chose on purpose stops being invisible.
#
# An authored size always wins; this only says what the air wants. It is already saying
# something about this house: DU-B-ERV-SUP-TRUNK carries 210 cfm in 6" galvanized and runs
# at 0.322 in. w.g./100 ft against this 0.08, which is the same fact `notes/
# erv_static_budget.md` reaches from the other end — the Broan's "210 at 0.2 or 206 at 0.4"
# argument is a duct too small for its air, stated as a curve.
duct_friction_in_wg_per_100ft = 0.08

# Open air in a finished room, per foot, by occupancy. **The ordering is the point, not the
# magnitudes**: a bedroom and a media room are where a bulkhead is least welcome, a hallway
# is where one is normal, and a garage or a mechanical room is free because pipe hangs there
# by design — the same set `EXPOSED_SERVICE_OCCUPANCIES` names, arrived at from the cost
# side. An occupancy with no row here is priced as a living room rather than as free.
[mep.routing.room_per_ft]
bedroom = 96.0
media = 96.0
living = 72.0
dining = 72.0
office = 72.0
kitchen = 48.0
bathroom = 48.0
laundry = 36.0
hallway = 24.0
stair = 24.0
utility = 0.0
mechanical = 0.0
garage = 0.0
storage = 0.0
unconditioned = 0.0

[units]
system = "imperial"

# The legacy floorplan pages are RETIRED as underlays. They were a calibration aid for
# the look-at-it loop, and every drawing this house emits now shows the model and only the
# model — a reference raster behind the linework reads as part of the output to anybody who
# did not author it. The pages themselves stay in ../../catlin_floorplan/ as history; the
# 36' structural module and the 16 in. grid were always the authority.

# What the set says about itself. The engine's own default is "NOT FOR CONSTRUCTION",
# which is the honest thing for an engine to say — only the owner of the building can say
# a set is being submitted for permit, so it is said here and nowhere in the engine.
[print]
issue = "ISSUED FOR PERMIT"
# Sheet-number prefixes forced into / out of the `--set permit` set. The default split
# already omits separate E-1xx power and P-1xx plumbing plans; fixtures remain on the floor
# plans. A-502's deck-bearing crop adds no bearing information beyond the structural plans,
# and A-506's generic hall-shower crop adds no permit-review information. They remain in the
# full set at their authored numbers. `permit_add = ["E-1", "P-1"]` restores the trade plans
# in one line if a reviewer asks.
permit_add = []
permit_drop = ["A-502", "A-506"]


# --- decided advisories -------------------------------------------------------------------
#
# `suppress` takes a bare `check.id` (silence the rule everywhere) or `check.id:ELEMENT-TAG`
# (silence it on ONE element). Only the second form is used here, and it is used sparingly:
# an entry means the finding is real, was measured, and was decided against for a reason the
# model cannot carry. The reason goes here, beside the entry, and in the plan source at the
# element itself.
[checks]
suppress = [
  # ** mep.run_interference: 67 REAL INTERPENETRATIONS, RE-MEASURED 2026-09-19 AFTER THE
  # THREE CAVITY CAMPAIGNS AND THE PLUMBING PASS. NOT A DECISION — AN OPEN CAMPAIGN. **
  #
  # ** 150 -> 114 -> 93 -> 67, AND EVERY STEP IS A REDESIGN RATHER THAN A RE-READING. ** D1
  # took level 2 trunk-and-branch, D2 split the attic chase into four lanes, D3 re-laid the
  # basement on the four corridors that are actually clear and put each radial on its own
  # dimensioned collar; then P1/P2/P3 moved the vents, the cold lane and three supply
  # branches. **duct <-> duct is now ZERO in this house** — it was 37 at the Phase 1 exit,
  # and every one of them was two branches leaving one plenum on one line. So is
  # supply <-> vent, and supply <-> supply is down to one.
  #
  # ** WHAT IS LEFT IS NOT ONE KIND OF THING, AND THAT IS THE USEFUL PART. ** 29 of the 67
  # are conduit, which is laid LAST in `routing/campaign.TRADE_ORDER` because a raceway
  # bends round a duct rather than the other way about — Phase 4 ran the campaign and its
  # own `--evaluate` refused the result (plans/TODO.md). 14 more are one vent against the
  # level-2 duct bank, pinned by a rule no check in this engine reads: a vent must be graded
  # to drain back (P3104.1), so it cannot dip under one duct and climb over the next. The
  # rest are individually argued in plans/TODO.md, several of them to a hundredth of an
  # inch.
  #
  # ** 146 -> 150, AND THE BUILDING DID NOT MOVE. ** Three mechanisms, each named, and two
  # of them are the engine seeing BETTER rather than worse:
  #
  #   -26  THE PRISM STOPPED BEING THE VERDICT (E1). `resolve/mep_envelopes` bands a
  #        sloping leg over its whole fall — the right solid for a router choosing a lane,
  #        the wrong one for a reading — so a drain passing four inches under a duct read
  #        as interpenetrating it. The STRtree over those prisms is still the coarse
  #        filter; the fine answer is now `resolve/mep_clearance.segment_clearance`,
  #        measured at the station where the two legs are actually closest. PR-B-KITCH-DRAIN
  #        leg 6 clears DU-B-ERV-RET-TRUNK by 4.26" and nine main-ceiling radials clear
  #        PR-M-S-BATH1-WC-DRAIN leg 2 by 0.0"-0.95". Twenty-five of those, plus four
  #        risers whose JOINT was recorded at the bottom of a drop instead of at the tee
  #        (E2: `run_joints` returns a z BAND now, the intersection of both runs' adjacent
  #        segment ranges, never the union).
  #     +1 AND THE SAME PASS FOUND ONE. PR-B-SH2-DRAIN x PR-B-WC2-DRAIN overlap 0.31" six
  #        inches upstream of the fitting they share — outside a 3" drain's stated reach.
  #        The old pardon covered any overlap region that merely TOUCHED a joint anywhere.
  #   +29  THE RACEWAYS ARE PLACED IN z (E7). All seventeen ConduitRuns now author
  #        `elevations`, one per vertex, so `mep.run_interference` grades them instead of
  #        naming them as a coverage gap. This is the rise, it is deliberate, and it is the
  #        whole point: "a duct cannot be proven clear of something the model does not
  #        place in z" (plans/TODO.md). The check's own docstring expected ~100 against the
  #        old "rises at its last point" reconstruction; 29 is what survives an honest
  #        measure, which is E1 paying for E7.
  #
  # The class breakdown, and it is the line that goes stale first:
  #
  #                        2026-09-18   Phase 1 exit   after D1-D3   after P1-P3
  #     duct <-> duct            37          37             0             0
  #     duct <-> vent            28          22            14            14
  #     conduit <-> vent          0          18            18            15      -3
  #     drain <-> duct           33          22             7             7
  #     drain <-> supply         32          11            11             7      -4
  #     conduit <-> duct          0           3             6             6
  #     duct <-> supply          12           7             7             5      -2
  #     conduit <-> conduit       0           4             4             4
  #     conduit <-> supply        0           4             4             4
  #     drain <-> drain           -           4             4             3      -1
  #     supply <-> supply        18          10            10             1      -9
  #     drain <-> vent            -           5             5             1      -4
  #     supply <-> vent          12           2             2             0      -2
  #     vent <-> vent             -           1             1             0      -1
  #                             ---         ---           ---           ---
  #                             188         150            93            67
  # The rows sum to the headline; if they stop summing, one of them went stale. The four
  # rows that start blank were inside the older column's "everything else" (which held the
  # two radon pairs, drain<->vent 6, drain<->drain 3 and five singles) and are broken out
  # now because E7 made the tail big enough to read. The Phase 1 column's own
  # supply<->supply 9 and "everything else" 1 are one row here: PR-B-ERV-COND reads as a
  # drain under the classifier the third column was taken with.
  #
  # ** THE AIR IS DONE AND THE WATER IS MOSTLY DONE. ** duct<->duct, supply<->vent and
  # vent<->vent are all zero; supply<->supply went 18 -> 1 when the cold lane moved off
  # PR-M-S-BATH1-DRAIN's riser and the same-band crossings stepped into the empty half of
  # the I-joist web. conduit<->duct holds the three CD-A-DATA-NE pairs D2 made and deferred
  # on purpose. The two rows that have not moved since the Phase 1 exit are duct<->vent
  # (one vent, one rule) and drain<->duct, and both are argued by name in plans/TODO.md.
  #
  # This is the one blanket entry in this file about run-against-run geometry, and it is
  # the only one that is not about a single element. The check is right: it compares every
  # pair of runs envelope against envelope at the real outside diameter plus insulation,
  # measures the deepest contact at the station where it happens, and exempts a CONTACT
  # only where its LOBE's peak lies within a fitting's reach of a joint between the two, or
  # a rough opening names them both (a shared sleeve), or the two are bundled risers of one
  # VentRun (one authored element, not a pair). The median overlap is around two inches and
  # the worst are 4.00", which is one 4" duct entirely inside another.
  #
  # ** WHAT IS LEFT IS NOT A SEARCH PROBLEM, AND THAT WAS MEASURED RATHER THAN ASSUMED. **
  # Every routable class was run with `--alternatives 3 --evaluate` on 2026-09-19: the
  # three worst vents (31 pairs between them) all break `mep.vent_reachability` or
  # `mep.trap_arm_length` on every alternative, because a vent is pinned at BOTH ends by
  # the fixtures it serves; the basement drains are out of head, which
  # `min_drain_slope_margin_in_per_ft = 0.0` above already says; and the ERV ducts want a
  # design answer — soffits, or authored lanes, or a different topology — because a 4"
  # round duct is not bored through a stud. The three cavity design campaigns are that
  # answer, and `mep.open_web_panel` (below) is now able to price the level-2 one.
  #
  # ** WHY IT IS SUPPRESSED RATHER THAN FIXED TODAY. ** Fixing it is a design campaign, not
  # an edit: every one of the 150 is a pair of authored lanes, and moving either end of
  # either run re-opens its own head budget, its bay occupancy and its member crossings.
  # Landing the check red instead would take `haus print`, the handoff bundle and the CI
  # gate down with it and teach everyone to ignore a red report, which is worse than either
  # honest alternative.
  #
  # ** THIS SUPPRESSION IS A DEBT WITH A NUMBER ON IT. ** Re-open it deliberately: delete
  # this entry, run `haus check houses/catlin --only fail`, and the count is the score.
  # Do not let a cleanup silently keep it, and do not let the number rise — unless the
  # engine's eyesight improved, which is what happened on 2026-09-18 and again on
  # 2026-09-19, and which the entry has to say out loud when it does.
  "mep.run_interference",

  # ** mep.run_through_plate: 15 TOP PLATES CUT PAST 50%, AND THE MODEL HAS NO WAY TO SAY
  # A TIE IS THERE. MEASURED 2026-09-17. **
  #
  # IRC R602.6.1 PERMITS a top plate cut or notched more than 50% of its width when a
  # galvanized 16 ga x 1 1/2" tie is fastened across it, lapping 6" past the opening each
  # way with eight 10d nails a side. A cut plate with that strap on it is built every day,
  # and every one of these 15 is that ordinary detail: 2" and 3" drains and vents through
  # 2x4 and 2x6 plates. The check reports them UNKNOWN rather than FAIL for exactly this
  # reason — the finding is "the section says a tie, and this model carries no plate tie to
  # point at", which is a gap in the MODEL's vocabulary and not a defect in the building.
  #
  # ** WHAT CLOSES IT IS A SCHEMA, NOT AN EDIT. ** `FramedMember.connection` is a free-form
  # string and nothing reads it for this; the day it can say "plate-tie" (or a `Connector`
  # in the catalog can be placed on a plate) the check becomes an honest PASS or FAIL and
  # this entry goes. Until then it would sit as 15 permanent UNKNOWNs in front of every
  # reader of the report and in the way of `haus print`, which teaches people to skip the
  # unknowns — the one habit a report cannot survive.
  "mep.run_through_plate",

  # ** mep.run_through_stud: CLOSED 2026-09-20 BY RETYPING THE WALLS. NOTHING SUPPRESSED. **
  #
  # This list held 7 over-bores on 5 runs, itemised, each entry saying its honest fix was a
  # wall-assembly change rather than a route. That change was made, so the entries are gone
  # rather than re-argued — five walls, and the fifth was a surprise:
  #
  #   * the three 2" vents through 2x4 studs (60% of 3 1/2" is 2.10", a 2" vent is 2.375"
  #     outside). `W-A-BATH-S` 2x4 -> 2x6 and `W-B-SA-N2` / `W-B-ESS-W` to their 6" variants.
  #   * `PR-B-WC2-DRAIN`'s 3" through a non-bearing 2x6, over by two-tenths. `W-B-CW` 2x6 ->
  #     2x8, the authorized wet-wall change.
  #   * `DU-B-ERV-R-SAUNA-SUP`, which this file argued at length could NOT be fixed by
  #     routing and would need a framing decision. It was right, and the 2x8 above closes it
  #     for free: 4.00" against 4.35" allowed. No duct moved.
  #   * `W-A-STU-W` was never a 2x6 wall. `INT_2X6_STAGGERED_PLUMBING` is 2x4 studs on 2x6
  #     plates, so every bore graded at 2.10" while the prose everywhere called it a 2x6.
  #     De-staggered to `INT_2X6_PLUMBING_BATT`, which keeps the 3 1/2" batt the staggered
  #     assembly carried. Total thickness is identical, so no face moved.
  #
  # `mep.run_through_stud` is 0 FAIL. A new over-bore anywhere in the house now reports,
  # which is what the per-run form was protecting.

  # ** mep.run_in_slab: 2 RUNS INSIDE A POUR. NEW CHECK, 2026-09-19. AN OPEN CAMPAIGN. **
  #
  # The check this file's supply-band note above has asked for since the cold band moved
  # ("**A `mep.run_in_slab` check is the honest follow-on and is not written yet.**"). It
  # exists now, and the case that motivated it is already gone: PR-B-CW-TRUNK and
  # PR-B-HW-KITCH step back to the old bands at x=17'-6", so nothing lies in SL-M-DECK.
  # What it found instead is two things nothing else in the engine could see.
