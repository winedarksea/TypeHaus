[project]
# Whose code this house is checked against (checks/code/mn_residential/profile.py).
jurisdiction = "mn-2020"

[envelope]
wall_r = 40
roof_r = 60
window_u = 0.25
ach50 = 1.0
interior_setpoint_f = 70
interior_relative_humidity = 0.35
exterior_relative_humidity = 0.80
south_wwr_threshold = 0.40
adequate_overhang_ft = 0.0

[framing]
module_in = 16
corner = "4-stud"
# THE RO LADDER. These three numbers are one rule seen at three rungs, and the rule is
# arithmetic on the 16" module and a 1.5" stud, not code: how wide can a rough opening get
# before it costs one more stud line? Every rung assumes the RO is centred where it is
# cheapest — a bay centre for the first, a stud line for the other two.
#
#   14"  NO stud broken. One bay is 16" - 1.5" = 14.5" clear. No header, no jacks, no
#        kings: the bay's own two studs carry the rough sill and head nailer.
max_window_ro_unbroken_in = 14
#
#   30"  ONE stud broken, NO jacks. Kill the stud in the middle and the two that flank it
#        leave 32" - 1.5" = 30.5" clear. Nothing eats into that on a NONBEARING wall,
#        because IRC R602.7.4 lets a nonbearing header be a single flat 2x4 nailed to the
#        stud each side — there is no jack under it to lose width to.
#        Was 42 until 2026-08-25, which was the two-broken-stud rung (48" - 1.5" - 3" of
#        jacks) and a leftover from the retired 42" WT-4248. No window in the house was
#        over 30" when it came down, so tightening it changed no result — it just stopped
#        the file from permitting a size the house had already decided against.
max_window_ro_nonbearing_in = 30
#
#   27"  ONE stud broken, WITH jacks. A BEARING header lands on a jack at each end
#        (R602.7.5), and each jack packs against its king, so the same 30.5" of clear bay
#        loses 2 x 1.5" = 27.5". THE 3" BETWEEN THIS RUNG AND THE ONE ABOVE IS THE PAIR OF
#        JACKS — that is the whole rule, and it is why the cap is a function of bearing
#        status and nothing else.
#        Went 27 -> 30 on 2026-08-01 to let WIN-S-BED1/BED2 reach R303.1's 8% glazing, and
#        came BACK to 27 on 2026-08-25 when that turned out to be avoidable: R303.1 binds
#        on area, and area can be bought in height. The two bedrooms are 27x54 (WT-2754)
#        now and clear R303.1 by wider margins than the 30x48 did. See the long note at
#        WIN-S-BED1 in plan/storeys/second.py.
#
# R602.7.5 does permit "approved framing anchors" in place of a jack, so a header hanger
# would buy back the 3" and let a 30" RO sit in a bearing wall on one broken stud. That is
# a real option, not a fiction — it is declined here because it is per-opening hardware and
# a detail the framer has to be told about, which is exactly the cost this preference exists
# to avoid. If a future opening needs it, raise this number deliberately and say so.
max_window_ro_bearing_in = 27

[structural]
# The dead load a guard may put on ordinary wood framing (structural.masonry_guard_bearing).
# A guard's own weight is derived from its assembly's layers and their material densities, so
# this is the only authored number in that rule: roughly a heavy wood guard with 6x6 posts,
# which is what a deck rim designed to R507's 40 psf live + 10 psf dead was drawn expecting.
# The porch's grouted-CMU-and-white-brick parapet is ~420 plf against it — which is the point:
# it lands on the concrete sunken-garden walls, and it could not land on a wood deck.
max_guard_dead_load_on_wood_plf = 50

# ** THE NORTH ENTRY CANOPY'S DESIGN SNOW, AND IT IS A DRIFT CASE, NOT THE GROUND LOAD. **
# The house's north face is a gable end standing 6 1/2" south of the passage roof and rising
# 12 to 21 feet above it. That is an ASCE 7 §7.7 roof-step drift and it governs. Worked by
# hand at the site's authored ground_snow_load_psf = 50 (notes/north_entry_piers.md §3):
#
#   snow density   gamma = 0.13(50) + 14                        = 20.5 pcf
#   balanced, Ct 1.2 (unheated open canopy), Ce = Is = 1.0      = 42 psf
#   leeward drift  hd    = 0.43 * 36^(1/3) * 60^(1/4) - 1.5     = 2.45 ft
#   drift surcharge pd   = hd * gamma                           = 50.3 psf at the house wall
#   drift width     w    = 4 * hd                               = 9.8 ft
#   average surcharge across the canopy's own 6'-0" of that triangle
#                        = (47.1 + 16.3) / 2                    = 31.7 psf
#   design snow          = 42 + 31.7                            = 73.7 psf
#
# ** THE DRIFT IS 9.8 FT LONG AND THE PASSAGE IS 6 FT. ** The triangle runs another 3.8 ft
# into the garage roof, so the garage's two southernmost trusses are drift trusses too. Spec
# them to the fabricator as p_g = 50 psf WITH the surcharge from the adjacent house wall named
# explicitly; a quote against "50 psf ground snow" prices ordinary trusses.
#
# The engine computes NO part of this -- the only p_f in the codebase is a 0.7 * p_g in a
# drawing emitter -- which is why it is authored here rather than derived.
roof_beam_snow_psf = 73.7
roof_beam_dead_psf = 10.0

[plumbing]
drain_stack_required_structure_in = 5.5
# **The visible-copper rule retired on 2026-08-21, and it retired the way it was built to.**
#
# It read: supply pipe you can see is lacquered copper, everywhere else PEX. "Where you can
# see it" was never a list of run tags — `mep.pipe_material_preference` asks what is
# *directly above* each basement supply segment, because a cast concrete deck means the pipe
# hangs in the open and reads as part of the room, while a framed floor means it will be
# covered. The note here said so in as many words: "Change SL-M-DECK to wood joists and
# everything under it stops being visible pipe with nothing here to edit."
#
# That is what happened. Two thirds of the basement ceiling is I-joists now, and the owner's
# call on the other third was gypsum over the EPS anyway — IRC R316.4 wants a thermal barrier
# there, and stopping the board at the boundary to expose 414 SF of soffit was not worth it.
# With drywall on the whole ceiling there is no visible pipe left to have a rule about, so
# both keys are deleted rather than restated, and basement supply reverts to the default
# (PEX, unfinished). Deleting them is the edit; the rule needed no other change.
#
# visible_basement_material = "copper"
# visible_basement_finish = "lacquered"

[units]
system = "imperial"

# Reference only. These pages are never permit/model geometry; the 36' structural module
# and the 16 in. grid remain authoritative where the old page disagrees. What the underlay
# *is* good for is checking interior partitions against the survey, so it has to land on
# the model within an inch or two — the old calibration (from the legacy drawing's labelled
# 24' garage width) was ~5% off in scale and ~5 m off in origin, which is useless as a ruler.
#
# Recalibrated from the vector twins in the same folder. Each `.svg` is a metric drawing at
# 74.7029 px/m — confirmed per page from its own `transform="matrix(74.7029 0 0 74.7029 …)"`
# — and its `path` #0 is the wall-fill polygon. All four PNGs are 1280x1920 on that grid, so
#     width_m  = 1280 / 74.7029 = 17.1345
#     height_m = 1920 / 74.7029 = 25.7018
# on every page, and only the origin differs. With (x0, y0) the SW corner of the wall
# polygon in page pixels (min x, max y — SVG y runs down),
#     origin_x_m = -x0 / 74.7029        origin_y_m = -(1920 - y0) / 74.7029
# which puts the drawing's outer SW building corner on the model origin, i.e. the SW
# sheathing corner. On the 1st-floor page the polygon also contains the detached garage;
# the corner below is the *house* block's (subpaths south of the 4' gap), not the garage's.
[[underlay]]
path = "../../catlin_floorplan/Colin House_Basement_Level 1.png"
storey = "basement"
origin_x_m = -3.1807
origin_y_m = -12.3580
width_m = 17.1345
height_m = 25.7018
opacity = 0.30

[[underlay]]
path = "../../catlin_floorplan/Colin House_1st_Floor.png"
storey = "main"
origin_x_m = -2.9769
origin_y_m = -4.7410
width_m = 17.1345
height_m = 25.7018
opacity = 0.30

[[underlay]]
path = "../../catlin_floorplan/Colin House_2nd_Floor.png"
storey = "second"
origin_x_m = -3.0595
origin_y_m = -9.0316
width_m = 17.1345
height_m = 25.7018
opacity = 0.30

[[underlay]]
path = "../../catlin_floorplan/Colin House_3rd_Floor.png"
storey = "attic"
origin_x_m = -3.0382
origin_y_m = -8.0507
width_m = 17.1345
height_m = 25.7018
opacity = 0.30
# What the set says about itself. The engine's own default is "NOT FOR CONSTRUCTION",
# which is the honest thing for an engine to say — only the owner of the building can say
# a set is being submitted for permit, so it is said here and nowhere in the engine.
[print]
issue = "ISSUED FOR PERMIT"
# Sheet-number prefixes forced into / out of the `--set permit` set. Both empty: the
# default split (no E-1xx power, no P-1xx plumbing) is what the Saint Paul DSI new-
# construction checklist asks for — fixtures go on the floor plans. `permit_add =
# ["E-1", "P-1"]` puts them back in one line if a reviewer asks.
permit_add = []
permit_drop = []


# --- decided advisories -------------------------------------------------------------------
#
# `suppress` takes a bare `check.id` (silence the rule everywhere) or `check.id:ELEMENT-TAG`
# (silence it on ONE element). Only the second form is used here, and it is used sparingly:
# an entry means the finding is real, was measured, and was decided against for a reason the
# model cannot carry. The reason goes here, beside the entry, and in the plan source at the
# element itself.
[checks]
suppress = [
  # D-G-OVERHEAD's centre is at 12'-0", 12" off the 24" module, and it cuts 9 stud lines
  # where 8 would do. The decision is unchanged from the 16"-module reading it was first
  # taken against (2026-08-26) and the arithmetic under it got WORSE, which is the reason to
  # re-state it rather than carry it: at 16" o.c. the miss was 8" and every legal station
  # was 8" away (104"/120"/136"/152"/168"/184"); at 24" o.c. — GARAGE_WALL_2X6, 2026-08-31 —
  # the miss is 12" and the nearest legal centres are 11'-0" and 13'-0".
  #
  # ** THE FACADE ARGUMENT THAT CARRIED THIS DIED ON 2026-09-03, AND THE SUPPRESSION IS
  # THEREFORE WEAKER THAN IT LOOKS. ** It used to read: moving the door 12" makes the two
  # wainscot piers flanking it 5'-0" and 3'-0" where they are 4'-0" and 4'-0", and a visibly
  # asymmetric wainscot on the garage's main facade is a worse building than one extra cut
  # stud. There is no wainscot any more — the base skin is a 24" band on the stem, uniform
  # on all four walls, and it does not care where the door sits.
  #
  # What is left is a COST OF MOVING, not a reason not to move: OVERHEAD_DOOR_OFFSET is not
  # just the door's offset. params/foundations.py gaps the ICF stem into a grade beam on it,
  # so the gap nodes, two stem segments, their footings and the two STEM_TOP_Z_FLASHING
  # break stations all travel with the door, and plan/mep_sleeves.py's water-service sleeve
  # is pinned to the stem footing that happens to sit over it (integrity.sleeve_in_opening
  # caught exactly that the last time this constant moved).
  #
  # ** THIS IS AN OPEN OWNER QUESTION, NOT A SETTLED DECISION. ** One extra cut stud against
  # a vehicle door centred on the framing module, with a day of foundation re-derivation
  # between them. Left suppressed so the report stays clean while it is decided; re-open it
  # deliberately, do not let a cleanup silently keep it.
  "structural.door_framing_module:D-G-OVERHEAD",

  # D-M-BATH2's RO was moved flush against FX-M-BATH2-SINK's east edge (24-15/16") on
  # 2026-09-09, off W-M-BDN1's 16" module by ~8" with no legal station nearby (32"/48"
  # both put the leaf back into the vanity or the shower). W-M-BDN1 is INT_2X4_PARTITION,
  # NONBEARING — one extra cut stud, not a header redesign. Left suppressed because
  # missing the module IS the trade this move makes, not an oversight.
  "structural.door_framing_module:D-M-BATH2",
]
