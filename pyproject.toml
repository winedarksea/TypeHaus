[project]
name = "type-haus-workspace"
version = "0.0.0"
description = "Type:Haus monorepo workspace root (not published)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/engine"]

[tool.uv.sources]
typehaus = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/engine/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "packages/engine/src"
