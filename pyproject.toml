[project]
name = "type-haus-workspace"
version = "0.0.0"
description = "Type:Haus monorepo workspace root (not published)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/engine"]

[tool.uv.sources]
typehaus = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/engine/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 wants `class X(str, Enum)` rewritten as `enum.StrEnum`. Declined, deliberately, for
# the four classes it fires on (diff.report.ChangeKind; model.placeables.PlacementStrategy,
# MountKind, ClearancePolicy).
#
# The two are not interchangeable: `str(SomeStrEnum.X)` is the bare value, while
# `str(Mixed.X)` is "Mixed.X". Every one of these enums is on a path where that string is
# the product rather than a debug convenience — ChangeKind lands in the diff report, and the
# placeable enums are serialised into model.json and round-tripped back out through source
# writeback. A silent change to how one of them renders is a corrupted plan file or a golden
# that no longer matches, which is a bad trade for a style rule.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# B008 guards against a *mutable* default being built once and shared across calls. All 41
# hits in this repo are calls that cannot be mutated, so the rule was firing on correct code:
#
#   typer.Argument / typer.Option — the documented way to declare a CLI parameter. Typer
#     reads these sentinels off the signature, so "call it inside the function instead" is
#     not available; every `haus` subcommand in cli/ would have to be rewritten against the
#     framework to silence a warning about a bug it cannot have.
#   ImportLimits — a @dataclass(frozen=True) (source/placeable_import.py). Frozen is exactly
#     the property B008 is checking for.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "typehaus.source.placeable_import.ImportLimits",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "packages/engine/src"

# Bare `pytest` is serial and takes over an hour on this suite; xdist with per-file
# distribution brings it to ~4 min. `loadfile` (not `load`) keeps every test in a module on
# one worker, so module-scoped house fixtures are built once each rather than per test.
#
# This is the *only* pytest config in the repo. packages/engine/pytest.ini used to shadow
# it — pytest picks the rootdir by walking up from the arguments, so `pytest
# packages/engine/tests` found that file first and silently ran serial while a bare `pytest`
# from the repo root ran parallel. One file, one rootdir, one set of addopts.
[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]
addopts = "-q -n 6 --dist loadfile -p no:cacheprovider"
# The one marker. `scripts/verify.sh --fast` deselects it; the full gate runs everything, so
# `slow` is a fast-loop convenience and never a quarantine. Mark a MODULE (module-level
# `pytestmark = pytest.mark.slow`) rather than scattering per-test marks: the unit that costs
# real time here is a module's shared fixture, and `--dist loadfile` schedules by module too.
#
# Earn the mark — measure with `--durations` first. A module marked `slow` that is no longer
# slow is just a test nobody runs.
markers = [
  "slow: full IFC emission, permit-set rendering, golden comparison, subprocess benchmarks",
]
