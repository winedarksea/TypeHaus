<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable=no: it is a WCAG 1.4.4 failure, iOS Safari has ignored it since
         iOS 10 anyway, and the thing it was there to stop — pinch fighting the canvas — is
         already handled properly by `touch-action: none` on .canvas-svg. viewport-fit=cover
         is required or every env(safe-area-inset-*) resolves to 0px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Type:Haus</title>
    <meta
      name="description"
      content="Type:Haus editor — 2D plan and 3D model of a house, resolved in your browser."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2E3440" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <!-- The unprefixed name is the standard one; Safari still reads the apple- variant, and
         Chrome logs a deprecation warning if only the apple- one is present. Ship both. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Type:Haus" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
