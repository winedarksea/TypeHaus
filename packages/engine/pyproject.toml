[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "typehaus"
version = "0.1.0"
description = "Type:Haus — infrastructure-as-code for residential houses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Colin Catlin", email = "colin.catlin@gmail.com" }]
requires-python = ">=3.11"
keywords = ["architecture", "BIM", "IFC", "residential", "infrastructure-as-code", "CAD"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "shapely>=2.0",
    "libcst>=1.1",
    "ifcopenshell>=0.8,<0.9",
    "ezdxf>=1.1",
    "matplotlib>=3.8",
    "pyproj>=3.6",
    "trimesh>=4.0",
]

[project.optional-dependencies]
# The FastAPI server (`haus serve`) + live-reload watcher — optional so a headless
# build/check/render install stays lean (→ 20 §FastAPI server).
# `websockets` is required for the `/events` live-reload socket — bare `uvicorn`
# ships no WS implementation and rejects every upgrade with 403.
server = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "watchfiles>=0.21"]
dev = [
    # ifctester drives the IDS handoff gate (tests/test_ifc_validation_gate.py) — the
    # conformance floor every exported IFC has to clear.
    "pytest>=8.0", "hypothesis>=6.90", "mypy>=1.9", "ruff>=0.4", "ifctester>=0.8",
    "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "watchfiles>=0.21", "httpx>=0.27",
]

[project.urls]
Homepage = "https://type-haus.com"
Repository = "https://github.com/colincatlin/TypeHaus"
Issues = "https://github.com/colincatlin/TypeHaus/issues"
Documentation = "https://type-haus.com"

[project.scripts]
haus = "typehaus.cli.app:main"

[project.entry-points.pytest11]
typehaus_checks = "typehaus.checks.pytest_plugin"

[tool.hatch.build.targets.wheel]
# The shared catalog lives *inside* the package as `typehaus/library/`, so `packages` covers
# it. Every house's plan source spells it `from library import ...`; `loader._alias_library`
# maps that name onto the packaged one. It is deliberately not a top-level `library` in
# site-packages — that name is taken on PyPI by an unrelated project, and installing both
# would break one of them.
packages = ["src/typehaus"]
# The pre-built UI ships inside the wheel so `pip install typehaus && haus serve`
# works without node (→ 02 §Repo layout). `scripts/package_ui.py` stages it there.
artifacts = ["src/typehaus/server/static/**"]

# The `haus new` starter template is staged by `hatch_build.py`, which resolves it in the
# monorepo (../../houses/starter) or in an extracted sdist (houses/starter) — a static
# force-include is right in one layout and a build failure in the other.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# PyPI gets both artifacts, and an sdist that cannot rebuild an equivalent wheel is a trap:
# it carries the starter template so the hook above finds it, and the staged UI so a
# wheel built from the sdist serves the editor too.
[tool.hatch.build.targets.sdist]
include = ["src/typehaus", "tests", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]
artifacts = ["src/typehaus/server/static/**"]

[tool.hatch.build.targets.sdist.force-include]
"../../houses/starter/plan" = "houses/starter/plan"
"../../houses/starter/brief.md" = "houses/starter/brief.md"
"../../houses/starter/preferences.toml" = "houses/starter/preferences.toml"
"../../houses/starter/CLAUDE.md" = "houses/starter/CLAUDE.md"
